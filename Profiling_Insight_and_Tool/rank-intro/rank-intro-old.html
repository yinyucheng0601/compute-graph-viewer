;\n          if (direction === 'forward') {\n            ctx.moveTo(px + inset, y + inset);\n            ctx.lineTo(px + step - inset, y + height / 2);\n            ctx.lineTo(px + inset, y + height - inset);\n          } else {\n            ctx.moveTo(px + step - inset, y + inset);\n            ctx.lineTo(px + inset, y + height / 2);\n            ctx.lineTo(px + step - inset, y + height - inset);\n          }\n          ctx.stroke();\n        }\n        ctx.restore();\n      }\n\n      /* ════════════════════════════════════════════════════════════════════\n         ④ 本仓新增（第 4 处相对上游的局部改动，与文件头注释同步登记）——\n         「前向计算」「反向计算」条内的 kernel 级分段：attn.q+kv 融合 / attn.core /\n         attn.out / router / experts，颜色语言对齐 ../parallel-topology/demo.html\n         的 kernelDefs（同一份「TP=青 · EP=紫 · 不切分=灰」约定，青色额外复用了本文件\n         已有的 ARCH_NODE_COLORS.attention_all_gather 系列色值，紫色复用\n         ARCH_NODE_COLORS.shared_expert_mlp / 设计系统 --highlight-l0a-violet-400）。\n         只画色带，不在色带里塞文字标签——条通常只有几十 px 宽，标签放不下，\n         细节交给下面扩展的 tooltip（呼应 demo.html「色带在图里，标签在放大视图/\n         悬浮层」的取舍）。\n\n         分段宽度优先用事件自带的真实数据：pp2-life-bwd 这类事件的 metrics 里已经有\n         weightGradient/inputGradient/tpComm/recomputation 四个真实子阶段耗时（单位\n         ms，四项相加正好等于整条的 durationMs），比瞎编一个比例表更诚实，因此凡是\n         metrics 里能凑齐≥2 个可解析的子阶段字段，就直接拿这些真实 ms 值当分段宽度；\n         其余事件（包括这份 mock 数据里绝大多数的 forward 事件，以及没有 metrics 子\n         阶段字段的 backward 事件）退回一张示意性的 kernel 构成比例表——比例值直接\n         沿用 demo.html kernelDefs 里 MoE 分支的那一组（1.5/.9/.8/.7/.8/.8），保持\n         两处「什么在跑」的直觉一致，但这里是独立重写的一份，不是抄过去的代码。\n\n         已经是单个 kernel 级算子事件的条（metrics.operatorId 存在，即 Rank 展开视图\n         里 attn.core / router-top-8 / routed-expert-bank 这些本来就只代表一个 kernel\n         的事件，本身已经用 ARCH_NODE_COLORS 上色）不再二次拆分，否则等于把一个已经\n         是「叶子」的算子再拆成好几段，语义上说不通。 */\n      const KERNEL_SEG_COLORS = Object.freeze({\n        tp: '#06B6D4',  // 与 ARCH_NODE_COLORS.attention_all_gather / attention_reduce_scatter / ffn_all_gather 同色：本文件已有的 TP 切分语义色\n        ep: '#A855F7'   // 与 ARCH_NODE_COLORS.shared_expert_mlp 同色，对应设计系统 --highlight-l0a-violet-400：本文件已有的 EP 切分语义色\n      });\n      function kernelSegColor(cls) {\n        if (cls === 'tp') return KERNEL_SEG_COLORS.tp;\n        if (cls === 'ep') return KERNEL_SEG_COLORS.ep;\n        return css('--foreground-muted') || '#8a93a6'; // 不切分/无参数算子：复用页面已有的 muted 文本色 token，不新引入灰色\n      }\n      // 示意性 kernel 构成比例表——沿用 openPangu 这类 MoE 结构，attn 三段 + router + 两批专家；\n      // 权重比例照抄 demo.html kernelDefs 的 MoE 分支（1.5/.9/.8/.7/.8/.8），两处口径保持一致。\n      const KERNEL_SCHEMATIC_TABLE = Object.freeze([\n        { key: 'attn-qkv', label: 'Attn Q+KV（融合）', w: 1.5, cls: 'tp' },\n        { key: 'attn-core', label: 'Attn Core', w: .9, cls: 'none' },\n        { key: 'attn-out', label: 'Attn Out', w: .8, cls: 'tp' },\n        { key: 'router', label: 'Router Top-K', w: .7, cls: 'ep' },\n        { key: 'experts-1', label: 'Experts（组批 1/2）', w: .8, cls: 'ep' },\n        { key: 'experts-2', label: 'Experts（组批 2/2）', w: .8, cls: 'ep' }\n      ]);\n      // pp2-life-bwd 这类事件里，哪几个 metrics 字段是「真实子阶段耗时」、该按什么色系画——\n      // weightGradient/tpComm 落在 TP 分片矩阵乘 / TP 通信上，归青色；inputGradient/recomputation\n      // 不挂具体的并行切法，归灰色。字段展示顺序沿用 humanKey 里已经登记的顺序。\n      const BACKWARD_METRIC_SEGMENT_SPECS = Object.freeze([\n        { key: 'weightGradient', label: '权重梯度（TP 分片矩阵乘）', cls: 'tp' },\n        { key: 'inputGradient', label: '输入梯度', cls: 'none' },\n        { key: 'tpComm', label: 'TP 通信', cls: 'tp' },\n        { key: 'recomputation', label: '激活重计算', cls: 'none' }\n      ]);\n      function parseMsMetric(value) {\n        const n = Number.parseFloat(value);\n        return Number.isFinite(n) && n > 0 ? n : null;\n      }\n      // 至少要凑齐两个可解析的真实子阶段字段才当「真实分段」用——只有一个字段不足以证明\n      // 这是一次可信的分解，退回示意表更稳妥。\n      function metricsDerivedSegments(item) {\n        const metrics = item.metrics || {};\n        const specs = BACKWARD_METRIC_SEGMENT_SPECS\n          .map(spec => ({ ...spec, w: parseMsMetric(metrics[spec.key]) }))\n          .filter(spec => spec.w !== null);\n        return specs.length >= 2 ? specs : null;\n      }\n      function kernelSegmentsFor(item) {\n        const derived = metricsDerivedSegments(item);\n        return derived ? { segments: derived, source: 'metrics' } : { segments: KERNEL_SCHEMATIC_TABLE, source: 'schematic' };\n      }\n      function isKernelSegmentable(item) {\n        return (item.kind === 'forward' || item.kind === 'backward') && !item.metrics?.operatorId;\n      }\n      /* 段 → ../parallel-topology/demo.html 里模块视图那 6 个功能块（MODULE_BLOCKS 的 id）。\n         这两份表是同一档粒度的两个说法：这边按时间轴排「这一节什么时候在跑」，那边按\n         结构排「这一节在整网上是哪一块」，所以能一一对上。experts 分成组批 1/2 是**同\n         一块**被分了两批算，不是两块——两个键都指向 experts。\n\n         真实子阶段那一组（weightGradient / inputGradient / tpComm / recomputation）**不\n         进这张表**：它们切的是\"反向的四个阶段\"，跟结构上的功能块是两个正交的分法，硬\n         配一个块过去等于告诉读者\"输入梯度就是 Attn·QKV\"，那是错的。报 null，宿主照\n         规矩把另外两格的块高亮散掉。 */\n      const KERNEL_SEG_BLOCK = Object.freeze({\n        'attn-qkv': 'attn.qkv', 'attn-core': 'attn.core', 'attn-out': 'attn.out',\n        'router': 'router', 'experts-1': 'experts', 'experts-2': 'experts'\n      });\n      function blockFromSegKey(segKey) {\n        return (segKey && KERNEL_SEG_BLOCK[segKey]) || null;\n      }\n      function segmentLabelOf(item, segKey) {\n        if (!segKey || !isKernelSegmentable(item)) return null;\n        const seg = kernelSegmentsFor(item).segments.find(s => s.key === segKey);\n        return seg ? seg.label : null;\n      }\n      /* out 传进来时，顺手把每一节的几何量出来交回去——命中区不在这里 push：\n         调用点画完这条还要 push 整条自己的命中矩形，而 hitAt 是\"后压入的先命中\"，\n         段先压就会被整条盖掉。交回去让调用点在整条之后再压，段才咬得住。 */\n      function drawKernelSegments(ctx, item, barX, barY, barW, barH, out) {\n        if (!isKernelSegmentable(item) || barW <= 0 || barH <= 0) return;\n        const { segments } = kernelSegmentsFor(item);\n        const total = segments.reduce((sum, seg) => sum + seg.w, 0);\n        if (!(total > 0)) return;\n        if (out) {\n          let ax = barX;\n          segments.forEach(seg => {\n            const sw = barW * seg.w / total;\n            /* 窄到 3px 以下的段不给命中区：点不准，还会把整条自己的命中区戳出一排洞，\n               读者想选整条却随机选中某一节。这种窄条上\"逐节\"本来就读不出来，靠悬浮。 */\n            if (sw >= 3) out.push({ x: ax, y: barY, w: sw, h: barH, item, action: 'select', segKey: seg.key });\n            ax += sw;\n          });\n        }\n        ctx.save();\n        roundedRect(ctx, barX, barY, barW, barH, 3);\n        ctx.clip();\n        ctx.globalAlpha = .5; // 半透明叠加在已经画好的 forward/backward 底色上：保留原有蓝/红主色，色带只做「构成」提示\n        /* 选中的那一节按不透明画：色带整体是 .5 的\"构成提示\"，选中的那一节要从\n           这层提示里跳出来，靠加边框不行——条只有十几 px 高，一圈边就把段本身\n           吃掉了。抬浓度是这里唯一还剩的余地。 */\n        const litSeg = item.id === selectedId ? selectedSegKey : null;\n        let segX = barX;\n        segments.forEach(seg => {\n          const segW = barW * seg.w / total;\n          ctx.globalAlpha = seg.key === litSeg ? 1 : .5;\n          ctx.fillStyle = kernelSegColor(seg.cls);\n          ctx.fillRect(segX, barY, Math.max(.6, segW), barH);\n          segX += segW;\n        });\n        ctx.globalAlpha = 1;\n        /* 再给选中那一节压一条上下贴边的白线：不透明度那一档在灰色段（不切分）\n           上几乎看不出差别——灰本来就低对比，.5 → 1 只是从\"更灰\"到\"灰\"。 */\n        if (litSeg) {\n          let lx = barX;\n          segments.forEach(seg => {\n            const segW = barW * seg.w / total;\n            if (seg.key === litSeg) {\n              ctx.strokeStyle = 'rgba(255,255,255,.85)';\n              ctx.lineWidth = 1;\n              ctx.beginPath();\n              ctx.moveTo(lx + .5, barY + .5); ctx.lineTo(lx + segW - .5, barY + .5);\n              ctx.moveTo(lx + .5, barY + barH - .5); ctx.lineTo(lx + segW - .5, barY + barH - .5);\n              ctx.stroke();\n            }\n            lx += segW;\n          });\n        }\n        if (barW >= 24) { // 条够宽时加一道浅分隔线，比纯拼色更容易看出这是几段\n          ctx.strokeStyle = 'rgba(255,255,255,.22)';\n          ctx.lineWidth = .5;\n          segX = barX;\n          segments.forEach(seg => {\n            const segW = barW * seg.w / total;\n            segX += segW;\n            if (segX < barX + barW - .5) {\n              ctx.beginPath(); ctx.moveTo(segX + .5, barY + 1); ctx.lineTo(segX + .5, barY + barH - 1); ctx.stroke();\n            }\n          });\n        }\n        /* 色带含义之前只在悬浮 tooltip 里说明——.timeline-footer 那行常驻图例在\n           combo-workbench 卡片内嵌形态下被 embed.css 整行 display:none（那 38px\n           留给泳道本身，不给图例），所以常驻图例这条路走不通，只能落回悬浮。\n           但悬浮要一格一格试才发现，段一多容易读成「一堆看不懂的花色」。\n           折中：段本身够宽（能放下 2 字符不糊）时，直接在段里刻它的切法缩写\n           （TP/EP，不切分的不写字——灰色本身就是\"没有切法\"，写\"—\"反而添乱），\n           不够宽的窄段仍然只能靠悬浮——两条腿走路，不必等布局改版。\n\n           兼容性修复（沿用 kernel 分段这一处局部改动，不算新增第五处）：条右边\n           紧跟着还会画 redrawTaskLabel 那行主标签（\"F · L0–L11 · TP0 / EP0\" 这类），\n           它左对齐从 barX+5 起笔——条不够宽时（未展开的「Rank N 前向/反向」条，\n           全貌 range 下常见）主标签会占掉条的大半甚至全部，这里的 TP/EP 缩写字\n           这时候还照画不误，就会跟主标签的字压在一起糊成一片、读不出是哪个\n           （2026-08 走查发现，即\"这些东西有时候会错乱\"那条反馈的根子）。\n           主标签没有开放测量接口，但这里拿的是同一个 ctx，直接照抄它\"截到\n           maxChars 个字再补……\"那句判断、用同一款字体量出真实像素宽度——\n           不按\"每字 6px\"死算：中文字形按等宽字体实际渲染比 6px 宽得多，\n           死算会漏留出地界，窄条上量出来\"没超\"其实已经贴着标签最后一个字了。\n           量完把字号立刻切回本函数自己那款 7px，不留在主标签的字号上。 */\n        const taskLabelFont = css('--font-mono') || 'monospace';\n        ctx.font = `${barW >= 72 ? '600 9px' : '600 8px'} ${taskLabelFont}`;\n        const taskLabelMaxChars = Math.max(4, Math.floor((barW - 8) / 6));\n        const taskLabelShown = item.label.length > taskLabelMaxChars\n          ? `${item.label.slice(0, Math.max(0, taskLabelMaxChars - 1))}…`\n          : item.label;\n        const taskLabelReservedW = barW < 28 ? 0 : 5 + ctx.measureText(taskLabelShown).width + 6;\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.font = `600 7px ${css('--font-mono') || 'monospace'}`;\n        segX = barX;\n        segments.forEach(seg => {\n          const segW = barW * seg.w / total;\n          if (segW >= 16 && seg.cls !== 'none' && segX >= barX + taskLabelReservedW) {\n            ctx.fillStyle = 'rgba(255,255,255,.92)';\n            ctx.fillText(seg.cls.toUpperCase(), segX + segW / 2, barY + barH / 2);\n          }\n          segX += segW;\n        });\n        ctx.restore();\n      }\n      // tooltip 里追加一行 kernel 分解——不重复 metrics 已经展示的原始字段，只把同一份\n      // segments 换算成人话（真实分段给 ms 数值，示意分段给百分比），并说明数据来源。\n      function kernelSegmentTooltipRow(item) {\n        if (!isKernelSegmentable(item)) return null;\n        const { segments, source } = kernelSegmentsFor(item);\n        const total = segments.reduce((sum, seg) => sum + seg.w, 0);\n        if (!(total > 0)) return null;\n        const parts = segments.map(seg => source === 'metrics'\n          ? `${seg.label} ${seg.w.toFixed(1)} ms`\n          : `${seg.label} ${Math.round(seg.w / total * 100)}%`);\n        const note = source === 'metrics' ? '真实子阶段耗时（来自本事件 metrics）' : '示意比例（无逐 kernel 真实计时，占位分解）';\n        return ['Kernel 分解', `${parts.join(' · ')} —— ${note}`];\n      }\n      /* ════════════════════════════════════════════════════════════════════ */\n\n      /* ════════════════════════════════════════════════════════════════════\n         ⑤ 本仓新增（第 5 处相对上游的局部改动，与文件头注释同步登记）——\n         点了泳道上的一个事件，回报宿主「这是哪个物理 Rank」，供整网图/主视图\n         照亮同一张卡（组合工作台已有 pushHL 那条\"过路高亮\"通道，反方向——从\n         整网图/主视图点某张卡回来——宿主直接复用 pushHL 推给这一格，接的是\n         ./embed-bridge.js 里新增的一小段，不算在这五处里，那是另一份文件）。\n\n         Rank 号从哪儿来：只有\"叶子\"事件（Rank 展开视图里的算子链、Rank 前向/\n         反向条本身、同步等待条）的 metrics 上挂着 `rankId: 'Rank N'`——见\n         eventsForOperatorWindow/gradientAllReduceEvent/buildRankHierarchyRows\n         那几处赋值。Rank 组行（rank-group-pp*-forward/backward）、Stage 概览行\n         （mbTotalEvent、stageEvents 里那些 PPn 前向/反向/通信）、张量驻留对象\n         都没有单一 Rank 可报——代表一整组或者跟 Rank 无关，报 null 让宿主把\n         另外两格的高亮散掉，好过硬点一个不代表这次点击的 Rank 误导读者。\n\n         不在这里猜\"没有 rankId 就退而求其次报 focusedRankRowId\"之类的近似值：\n         那等于用\"上一次展开过的 Rank\"冒充\"这一次点的是什么\"，两件事对不上。 */\n      function rankFromEventMetrics(metrics) {\n        const raw = metrics && metrics.rankId;\n        if (typeof raw !== 'string') return null;\n        const m = raw.match(/(\\d+)\\s*$/);\n        return m ? Number(m[1]) : null;\n      }\n      function notifyHostOfSwimlaneSelect(item) {\n        if (!window.parent || window.parent === window) return;\n        /* block：选中的那一节对应整网图模块视图里的哪个功能块（④ 本仓新增的\n           KERNEL_SEG_BLOCK）。没选中某一节、或者选中的是反向那四个真实子阶段\n           （跟结构块正交，配不上），一律报 null——跟 rank 报 null 同一条规矩：\n           让宿主把另外两格的块高亮散掉，好过硬指一个不代表这次点击的块。 */\n        window.parent.postMessage({\n          type: 'pto:swimlane-select',\n          rank: rankFromEventMetrics(item.metrics),\n          block: blockFromSegKey(selectedSegKey)\n        }, '*');\n      }\n      /* ════════════════════════════════════════════════════════════════════ */\n\n      function drawLaneGlyphTrack(ctx, x, y, width, height, direction, color) {\n        if (width <= 0 || height <= 0 || (direction !== 'forward' && direction !== 'backward')) return;\n        const glyph = direction === 'forward' ? '›' : '‹';\n        ctx.save();\n        ctx.beginPath();\n        ctx.rect(x, y, width, height);\n        ctx.clip();\n        ctx.fillStyle = color;\n        ctx.globalAlpha = .38;\n        ctx.font = `800 23px ${css('--font-mono') || 'monospace'}`;\n        ctx.textAlign = 'left';\n        ctx.textBaseline = 'middle';\n        ctx.shadowColor = rgbaFromHex(color, .38);\n        ctx.shadowBlur = 8;\n        const step = ctx.measureText(glyph).width + 2;\n        for (let px = x + 3; px < x + width + step; px += step) {\n          ctx.fillText(glyph, px, y + height / 2 + .5);\n        }\n        ctx.restore();\n      }\n      function drawDirectionalLaneEdgeTexture(ctx, lane, x, range, y, rowH) {\n        if (lane.rowType === 'rank' && isExpandedRow(lane)) return;\n        const laneEvents = eventsForLane(lane);\n        const forwardEvents = laneEvents.filter(item => item.kind === 'forward');\n        const backwardEvents = laneEvents.filter(item => item.kind === 'backward');\n        const textureY = y + 2;\n        const textureH = rowH - 4;\n\n        if (forwardEvents.length) {\n          const forwardStart = Math.min(...forwardEvents.map(item => item.startMs));\n          const edgeEnd = Math.min(forwardStart, range.end);\n          if (edgeEnd > range.start) {\n            const trackX = x(range.start);\n            const trackW = x(edgeEnd) - trackX;\n            drawLaneGlyphTrack(ctx, trackX, textureY, trackW, textureH, 'forward', COLORS.forward);\n          }\n        }\n\n        if (backwardEvents.length) {\n          const backwardEnd = Math.max(...backwardEvents.map(item => item.endMs));\n          const edgeStart = Math.max(backwardEnd, range.start);\n          if (edgeStart < range.end) {\n            const trackX = x(edgeStart);\n            const trackW = x(range.end) - trackX;\n            drawLaneGlyphTrack(ctx, trackX, textureY, trackW, textureH, 'backward', COLORS.backward);\n          }\n        }\n      }\n      function redrawTaskLabel(ctx, item, barX, barY, barW, barH) {\n        if (barW < 28) return;\n        const fontFamily = css('--font-mono') || 'monospace';\n        const maxChars = Math.max(4, Math.floor((barW - 8) / 6));\n        const label = item.label.length > maxChars ? `${item.label.slice(0, Math.max(0, maxChars - 1))}…` : item.label;\n        ctx.save();\n        roundedRect(ctx, barX + 1, barY + 1, Math.max(0, barW - 2), Math.max(0, barH - 2), 2);\n        ctx.clip();\n        ctx.fillStyle = 'rgba(255,255,255,.94)';\n        ctx.font = `${barW >= 72 ? '600 9px' : '600 8px'} ${fontFamily}`;\n        ctx.textAlign = 'left';\n        ctx.textBaseline = 'middle';\n        ctx.shadowColor = 'rgba(0,0,0,.7)';\n        ctx.shadowBlur = 2;\n        ctx.fillText(label, barX + 5, barY + barH / 2 + .5);\n        ctx.restore();\n      }\n      function drawRowExpand(ctx, lane, x, y, rowH) {\n        if (!isExpandableRow(lane)) return null;\n        const size = 14;\n        const iconY = y + Math.max(2, (rowH - size) / 2);\n        const expanded = isExpandedRow(lane);\n        ctx.save();\n        roundedRect(ctx, x, iconY, size, size, 4);\n        ctx.fillStyle = css('--surface-1') || 'rgba(255,255,255,.9)';\n        ctx.strokeStyle = css('--border-strong') || 'rgba(255,255,255,.68)';\n        ctx.lineWidth = 1;\n        ctx.fill();\n        ctx.stroke();\n        ctx.fillStyle = css('--foreground') || '#111827';\n        ctx.font = `800 12px ${css('--font-mono') || 'monospace'}`;\n        ctx.textAlign = 'center';\n        ctx.textBaseline = 'middle';\n        ctx.fillText(expanded ? '−' : '+', x + size / 2, iconY + size / 2 + .25);\n        ctx.restore();\n        return { x, y: iconY, w: size, h: size };\n      }\n\n      function laneHeaderParts(lane) {\n        const parts = String(lane.label || '').split(' · ');\n        if (parts.length < 2) return { object: lane.label, semantic: '' };\n        const owner = parts[0];\n        const scopeMatch = parts[1].match(/^(L\\d+(?:–L\\d+)?)(?:\\s+(.+))?$/);\n        if (/^PP\\d+$/.test(owner) && scopeMatch) {\n          return {\n            object: `${owner} · ${scopeMatch[1]}`,\n            semantic: [scopeMatch[2], ...parts.slice(2)].filter(Boolean).join(' · ')\n          };\n        }\n        return { object: owner, semantic: parts.slice(1).join(' · ') };\n      }\n\n      function fitCanvasText(ctx, value, maxWidth) {\n        const text = String(value || '');\n        if (ctx.measureText(text).width <= maxWidth) return text;\n        let fitted = text;\n        while (fitted.length > 1 && ctx.measureText(`${fitted}…`).width > maxWidth) fitted = fitted.slice(0, -1);\n        return `${fitted}…`;\n      }\n\n      function drawLaneHeader(ctx, lane, x, y, rowH, maxWidth, textColor) {\n        const parts = laneHeaderParts(lane);\n        const tagH = 18;\n        const tagY = y + (rowH - tagH) / 2;\n        ctx.save();\n        ctx.font = `650 10px ${css('--font-mono') || 'monospace'}`;\n        const tagLimit = parts.semantic ? Math.max(42, maxWidth * .58) : maxWidth;\n        const tagText = fitCanvasText(ctx, parts.object, Math.max(24, tagLimit - 14));\n        const tagW = Math.min(tagLimit, Math.max(30, ctx.measureText(tagText).width + 14));\n        roundedRect(ctx, x, tagY, tagW, tagH, 6);\n        ctx.fillStyle = css('--surface-2') || 'rgba(255,255,255,.06)';\n        ctx.strokeStyle = css('--border-strong') || 'rgba(255,255,255,.28)';\n        ctx.lineWidth = 1;\n        ctx.fill();\n        ctx.stroke();\n        ctx.fillStyle = textColor;\n        ctx.textAlign = 'left';\n        ctx.textBaseline = 'middle';\n        ctx.fillText(tagText, x + 7, tagY + tagH / 2 + .25);\n        if (parts.semantic) {\n          const semanticX = x + tagW + 8;\n          ctx.font = `600 10px ${css('--font-mono') || 'monospace'}`;\n          ctx.fillText(fitCanvasText(ctx, parts.semantic, Math.max(18, maxWidth - tagW - 8)), semanticX, y + rowH / 2 + .25);\n        }\n        ctx.restore();\n        return { x, y, w: maxWidth, h: rowH };\n      }\n\n      function drawExpandedRankHeader(ctx, lane, x, y, rowH, maxWidth, textColor) {\n        const tagH = TIMELINE_LAYOUT.eventHeight;\n        const tagY = y + TIMELINE_LAYOUT.rankTrackTop;\n        ctx.save();\n        ctx.font = `650 10px ${css('--font-mono') || 'monospace'}`;\n        const tagText = fitCanvasText(ctx, lane.label, Math.max(24, maxWidth - 92));\n        const tagW = Math.min(maxWidth - 78, Math.max(54, ctx.measureText(tagText).width + 14));\n        roundedRect(ctx, x, tagY, tagW, tagH, 6);\n        ctx.fillStyle = css('--surface-2') || 'rgba(255,255,255,.06)';\n        ctx.strokeStyle = css('--border-strong') || 'rgba(255,255,255,.28)';\n        ctx.lineWidth = 1;\n        ctx.fill();\n        ctx.stroke();\n        ctx.fillStyle = textColor;\n        ctx.textAlign = 'left';\n        ctx.textBaseline = 'middle';\n        ctx.fillText(tagText, x + 7, tagY + tagH / 2 + .25);\n        const trackLabels = ['计算流', '通信流', '并行计算流'];\n        ctx.fillStyle = css('--foreground-muted') || '#888';\n        ctx.font = `600 9px ${css('--font-mono') || 'monospace'}`;\n        ctx.textAlign = 'right';\n        trackLabels.forEach((label, track) => ctx.fillText(\n          label,\n          x + maxWidth,\n          y + TIMELINE_LAYOUT.rankTrackTop + TIMELINE_LAYOUT.eventHeight / 2 + track * TIMELINE_LAYOUT.rankTrackPitch\n        ));\n        ctx.restore();\n        return { x, y, w: maxWidth, h: rowH };\n      }\n\n      function rowHeaderTooltipHtml(lane) {\n        const parts = laneHeaderParts(lane);\n        const semanticRow = parts.semantic\n          ? `<div class=\"pto-swimlane-task-tooltip__row\"><span class=\"pto-swimlane-task-tooltip__key\">语义<\/span><span class=\"pto-swimlane-task-tooltip__value\">${escapeHtml(parts.semantic)}<\/span><\/div>`\n          : '';\n        const hierarchyDetail = lane.rowType === 'rank-group'\n          ? `MB07 → PP${lane.meta.stage} → DP${PARALLEL_WORLD.activeDp} → Rank ${lane.meta.rankIds[0]}–${lane.meta.rankIds.at(-1)}；展开后显示 TP2 × EP2 的 4 个物理 Rank。`\n          : lane.rowType === 'rank'\n            ? `MB07 → PP${lane.meta.stage} → Rank ${lane.meta.rank}（TP${lane.meta.tp} / EP${lane.meta.ep}）；展开后在同一 Rank 泳道内显示计算流、通信流与并行计算流。`\n            : lane.rowType === 'operator'\n              ? `Rank ${lane.meta.rank} → L${lane.meta.layerEnd} → ${lane.meta.graphNodeId}${lane.meta.collective ? ` · ${lane.meta.collective}` : ''}`\n              : '';\n        const hierarchyRow = hierarchyDetail\n          ? `<div class=\"pto-swimlane-task-tooltip__row\"><span class=\"pto-swimlane-task-tooltip__key\">层级<\/span><span class=\"pto-swimlane-task-tooltip__value\">${escapeHtml(hierarchyDetail)}<\/span><\/div>`\n          : '';\n        return `<div class=\"pto-swimlane-task-tooltip__title\">${escapeHtml(lane.label)}<\/div>` +\n          `<div class=\"pto-swimlane-task-tooltip__row\"><span class=\"pto-swimlane-task-tooltip__key\">对象<\/span><span class=\"pto-swimlane-task-tooltip__value\">${escapeHtml(parts.object)}<\/span><\/div>` + semanticRow + hierarchyRow;\n      }\n\n      function draw() {\n        const list = visibleRows();\n        const range = ranges[activeRange];\n        const dpr = Math.min(window.devicePixelRatio || 1, 2);\n        const gutter = 236;\n        const headerH = 48;\n        const baseRowH = TIMELINE_LAYOUT.rowHeight;\n        const expandedRankH = TIMELINE_LAYOUT.expandedRankHeight;\n        let layoutY = headerH;\n        const laneLayouts = list.map(lane => {\n          const rowH = lane.rowType === 'rank' && isExpandedRow(lane) ? expandedRankH : baseRowH;\n          const layout = { lane, y: layoutY, rowH };\n          layoutY += rowH;\n          return layout;\n        });\n        const viewportW = Math.max(640, scroll.clientWidth);\n        const width = Math.round(gutter + Math.max(520, viewportW - gutter) * zoom);\n        const height = layoutY + 12;\n        timelineSurface.style.width = `${width}px`;\n        timelineSurface.style.height = `${height}px`;\n        canvas.style.width = `${viewportW}px`;\n        canvas.style.height = `${height}px`;\n        canvas.width = Math.round(viewportW * dpr);\n        canvas.height = Math.round(height * dpr);\n        const ctx = canvas.getContext('2d');\n        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n        ctx.clearRect(0, 0, viewportW, height);\n        ctx.translate(-scroll.scrollLeft, 0);\n        hitRects = [];\n\n        const plotLeft = gutter;\n        const plotRight = width - 16;\n        const x = ms => plotLeft + ((ms - range.start) / (range.end - range.start)) * (plotRight - plotLeft);\n        const text = css('--foreground') || '#fff';\n        const muted = css('--foreground-muted') || '#888';\n        const subtle = css('--border-subtle') || 'rgba(255,255,255,.08)';\n        const surface = css('--surface-2') || '#1c1c1c';\n        ctx.fillStyle = surface;\n        ctx.fillRect(0, 0, width, headerH);\n\n        const tickStep = activeRange === 'global' ? 40 : activeRange === 'pp2' ? 20 : 10;\n        ctx.font = `500 10px ${css('--font-mono') || 'monospace'}`;\n        ctx.textBaseline = 'middle';\n        ctx.textAlign = 'center';\n        for (let tick = Math.ceil(range.start / tickStep) * tickStep; tick <= range.end; tick += tickStep) {\n          const px = x(tick);\n          ctx.strokeStyle = subtle;\n          ctx.beginPath(); ctx.moveTo(px + .5, headerH); ctx.lineTo(px + .5, height); ctx.stroke();\n          ctx.fillStyle = muted;\n          ctx.fillText(`${tick} ms`, px, 20);\n        }\n        ctx.textAlign = 'left';\n        ctx.fillStyle = text;\n        ctx.font = `600 11px ${css('--font-sans') || 'sans-serif'}`;\n        ctx.fillText('泳道 / 对象', 12, 20);\n        ctx.fillStyle = muted;\n        ctx.font = `500 10px ${css('--font-mono') || 'monospace'}`;\n        ctx.fillText(`${range.start.toFixed(2)} ms`, gutter, 38);\n        ctx.textAlign = 'right';\n        ctx.fillText(`${range.end.toFixed(2)} ms`, plotRight, 38);\n\n        laneLayouts.forEach(({ lane, y, rowH }, index) => {\n          if (index % 2) { ctx.fillStyle = css('--surface-disabled'); ctx.fillRect(0, y, width, rowH); }\n          ctx.strokeStyle = subtle;\n          ctx.beginPath(); ctx.moveTo(0, y + rowH + .5); ctx.lineTo(width, y + rowH + .5); ctx.stroke();\n          const expandedRank = lane.rowType === 'rank' && isExpandedRow(lane);\n          if (expandedRank) {\n            ctx.save();\n            ctx.strokeStyle = rgbaFromHex('#ffffff', .055);\n            for (let track = 1; track < 3; track += 1) {\n              const dividerY = y + TIMELINE_LAYOUT.rankTrackTop + track * TIMELINE_LAYOUT.rankTrackPitch - 1;\n              ctx.beginPath(); ctx.moveTo(gutter, dividerY + .5); ctx.lineTo(width, dividerY + .5); ctx.stroke();\n            }\n            ctx.restore();\n          }\n          drawDirectionalLaneEdgeTexture(ctx, lane, x, range, y, rowH);\n\n          eventsForL   /* 详情面板在设计像素下的排版：一组（Attention / MoE）= 边框 1 + 内衬 3 + 标题 9 + 缝 2 + 若干行算子，
     MoE 那组第 4 行换成 Expert Compute 盒子（标题 + 4×2 枚胶囊）；两组之间与末尾各一条残差。

  function panelSpec(col){

    }
    function group(title, rows, box){
      var gy = y, cy = y + 1 + DP.PAD;

      var g = items[items.length - 1];
      items.push({t:'title', x:inX, y:cy, w:inW, h:DP.TITLE, text:title}); cy += DP.TITLE + DP.GAP;
      rows.forEach(function(r, i){

          var ne = TOPO.epr, nr = Math.ceil(ne/4);

          items.push({t:'group', x:inX, y:cy, w:inW, h:bh});
          var by = cy + 1 + DP.PAD, bx = inX + 1 + DP.PAD, bw = inW - 2*(1 + DP.PAD);
          items.push({t:'title', x:bx, y:by, w:bw, h:DP.TITLE, text:'Expert Compute'}); by += DP.TITLE + DP.GAP;
          var cw = (bw - 3*DP.GAP)/4;
          for(var e = 0; e < ne; e++) items.push({t:'chip', x:bx + (e%4)*(cw + DP.GAP), y:by + (e>>2)*(DP.CHIP + DP.GAP), w:cw, h:DP.CHIP, i:e});

  /* 行标字号：屏幕上恒 ≥ 10px（世界字号 ∝ 1/k），但不能高过行；写不下就不画 */
  function rowMetrics(k){

    var m = rowMetrics(k);

  /* 算 / 改视图的那半（fitPlaneRaw / zoomAtRaw）与本页面的那半（读数、重画）分开：案例四借的是前一半 */
  function fitPlaneRaw(){
    var v = viewport(), aw = Math.max(50, v.x1 - v.x0 - 48), ah = Math.max(50, v.y1 - v.y0 - 48), k = 1;
    /* 道宽依赖 k、k 又依赖总宽：迭代几轮收敛，最后再按宽度兜一次底 */
    for(var i = 0; i < 4; i++){ syncGeom(k); k = clamp(Math.min(aw/plane.worldW, ah/plane.worldH), PL.MIN_K, PL.MAX_K); }
    syncGeom(k); if(plane.worldW*k > aw){ k = aw/plane.worldW; syncGeom(k); }

  function lanesBefore(px, laneScreen){

  /* stagebar 是源页面配置面板在本画布上的业务适配：不复制源页面的模型配置器，

  var stageCfgBtn = document.getElementById('stageCfgBtn'), stageCfgPanel = document.getElementById('stageCfgPanel');

    });

    });

    Array.prototype.forEach.call(stageCfgPanel.querySelectorAll('[data-comm-all]'), function(b){ b.disabled = step !== 8; });
    Array.prototype.forEach.call(stageCfgPanel.querySelectorAll('[data-mark]'), function(b){
      var k = b.dataset.mark, on = k === 'tp' ? tpOn : k === 'paint' ? paintOn : markOn[k] !== false;

    });

    var rankOn = selRank !== null, layerOn = !!(selLayer && selLayer.type === 'layer');
    rankFindBtn.classList.toggle('is-on', rankOn); rankFindBtn.setAttribute('aria-pressed', String(rankOn));
    layerFindBtn.classList.toggle('is-on', layerOn); layerFindBtn.setAttribute('aria-pressed', String(layerOn));

  stageCfgBtn.addEventListener('click', function(e){ e.stopPropagation(); setStageCfgOpen(!stageCfgPanel.classList.contains('is-open')); });
  stageCfgPanel.addEventListener('click', function(e){
    e.stopPropagation();
    var dimBtn = e.target.closest('[data-dim-step]');
    if(dimBtn){ go(+dimBtn.dataset.dimStep); return; }
    var poseBtn = e.target.closest('[data-pose]');
    if(poseBtn && !poseBtn.disabled){ setViewPose(poseBtn.dataset.pose); return; }
    var all = e.target.closest('[data-comm-all]');

    var cb = e.target.closest('[data-comm]');

  /* 点行：块本体加它左边的行标道都算这一行 */

  /* 一格的颜色 = 这一层的专家权重身份：层号 % 4。副本号**不参与色相**——EDP 0 / EDP 1 持的是同一份权重，

  /* ② 两段块：Attention / MoE 两条横带（端点列一条），inset 1px、缝 1px */

    ctx.fillStyle = 'rgba(' + FG + ',.15)'; rrect(ix, iy, iw, ih, 0);

    if(col.dense){   /* Dense 层：下面那条是普通 MLP，没有「哪一套专家」可言，灰的 */

      ctx.fillStyle = 'rgba(' + FG + ',.55)'; fitText('MLP', x + w/2, iy + ih + 1 + ih/2, iw - 4);

      document.getElementById('no').textContent = 'STEP ' + (i+1) + ' / ' + STEPS.length;
      document.getElementById('title').textContent = s.title;

    document.getElementById('next').disabled = i === STEPS.length - 1;
    Array.prototype.forEach.call(stepsEl.children, function(b, k){ b.classList.toggle('cur', k === i); b.classList.toggle('done', k < i); });

  }

  document.getElementById('next').addEventListener('click', function(){ go(step + 1); });
  document.addEventListener('keydown', function(e){

    else if(e.key === '-' || e.key === '_'){ zoomBy(1/1.25); e.preventDefault(); }
    else if(e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' '){ go(step + 1); e.preventDefault(); }

  /* 侧栏开关：记在 localStorage；两页的画布尺寸都跟着列宽变，广播一次 resize 让它们各自重量 */
  (function(){
    var btn = document.getElementById('sideTg'), on = true;
    try{ on = localStorage.getItem('ri-side') !== 'off'; }catch(e){}
    function apply(){
      if(on) delete pageEl.dataset.side; else pageEl.dataset.side = 'off';
      btn.setAttribute('aria-pressed', String(on));
      window.dispatchEvent(new Event('resize'));
    }
    btn.addEventListener('click', function(){ on = !on; try{ localStorage.setItem('ri-side', on ? 'on' : 'off'); }catch(e){} apply(); });
    apply();
  })();

  resize();
  var q0 = new URLSearchParams(location.search), st = parseInt(q0.get('step'), 10);
  go(isFinite(st) && st >= 1 ? st - 1 : 0);
  setTab(q0.get('tab'));

  /* 留给「实战场景」案例三：它要在自己的画布上再画一遍第 8 步那套卡阵（只亮一张），
     排布、投影、显存账、主题色都从这里拿，不另抄一份。TH / MEMC 是同一个对象，切主题后自动是新的 */

     借方的**（env），跑完再换回来。env 是借方自己保管的一个对象：

    }

  function cellRectOf(r, key){

  }

    PL:PL, DP:DP, SETC:SETC, BLUE:BLUE, topoOf:topoOf, colKey:colKey, memWith:memWith,
    build:function(env){ return planeEnv(env, function(){ plane = buildPlane(); env.plane = plane; return plane; }); },
    fit:function(env){ planeEnv(env, fitPlaneRaw); },
    draw:function(env){ planeEnv(env, function(){ drawPlane(now(), 1); }); },

    tick:function(env, mx, my){ return planeEnv(env, function(){ return planeTickAt(mx, my); }); },
    colAt:function(env, mx){ return planeEnv(env, function(){ return planeColAt(mx); }); },
    zoom:function(env, mx, my, nk){ return planeEnv(env, function(){ return zoomAtRaw(mx, my, nk); }); },
    pan:function(env){ planeEnv(env, clampPan); },
    sync:function(env, k){ planeEnv(env, function(){ syncGeom(k); }); },
    cellRect:function(env, r, key){ return planeEnv(env, function(){ return cellRectOf(r, key); }); },
    /* 放大到几倍才进「计算图」那一档（第 10 步三档里的第三档）——缩放动画的终点 */
    detailK:function(env){ return planeEnv(env, function(){ return PL.DETAIL_MIN_S/Math.min((plane.cellW - 2)/DP.W, (plane.cellH - 2)/plane.panels.moe.h); }); },
    /* 整网图要在自己的画布上把一层的计算图放大画：面板图元 + 画法都借这里的 */
    spec:function(env, col){ return planeEnv(env, function(){ return panelSpec(col); }); },
    detail:function(env, cx, cy, spec, s, col, c){ planeEnv(env, function(){ drawDetail(cx, cy, spec, s, col, c); }); }
  };
})();

<script>
/* ── 实战场景：一个案例一张图，一段一行字 ──────────────────────────────

   （tp2·pp4·dp16·ep8，48 层）缩小一号画的替身——每一跳撞的还是同三道边界

     热力案例图上下各多一条（页签、色阶图例），高度先扣掉；案例一没这两条，也扣同样的一份——
     两案的图一样大，案例一不因为少了两条就把集群撑满整屏。
     主体只吃图区的四分之三（FILL），四周留白——照 3D 取景器那种「一件元件摆在画布正中」的看法，
     栅格铺满整块图区固然屏效高，但读的人就没有「聚焦到一个元件」的感觉了；
     图区本来就窄（侧栏收起前的笔记本屏）时少留一点，别把格子压到看不清；
     格子上限也压到 20 × 16——大屏上整幅图最宽 1200 来像素，再宽就又铺满了。
     注意 32 行是竖着卡的那一头：FILL 每动一档行高只差 1px 上下，调的时候步子要迈大点 */

           marks: [{stage, s0, s1, ci0, ci1, k0, k1, label, inside, up}]（传播案例每段那枚黑标，

    h.push('<div class="cs-ptop"><div style="flex:none;width:' + G.lw + 'px"></div><div class="cs-bwrap" style="gap:' + G.bgap + 'px">');
    for(s = 0; s < 4; s++){

    }

      stageEl.querySelector('.pzoom').addEventListener('click', function(e){

      });

    function selectCell(r, key){

    }
    function matrixTarget(r, key){
      return function(){
        var rc = cv && PLN.cellRect(E, r, key); if(!rc) return null;

    }

    /* ── 画 ── */
    var raf = 0;
    function redraw(){ if(!raf) raf = requestAnimationFrame(function(){ raf = 0; if(cx) drawMatrix(); if(netDeck) netDeck.refresh(); }); }
    function drawMatrix(){
      cx.setTransform(E.DPR, 0, 0, E.DPR, 0, 0); cx.clearRect(0, 0, E.W, E.H);
      syncHeat();   /* 这一帧要不要铺逐格热力、按哪一层的中位数铺——PLN.draw 里的 cellHeat 钩子读的就是这两个 */
      syncDomain();

      drawCommDomain();

      if(overA > 0.005){
        cx.save(); cx.beginPath(); cx.rect(x0, y0, E.W - x0, E.H - y0); cx.clip(); cx.globalAlpha = overA;

    /* ══ 逐 Rank 逐 Layer 的耗时（构造数据）══════════════════════════════════════
       口径：一张卡跑完这一层前反向 kernel 的**纯计算**时间，**不含**它在同步点上的等待。
       等待是被别人拖出来的——混进来就再也分不清「谁慢」和「谁被拖慢」，而这张矩阵唯一
       值得答的就是这个区别。等待的代价单独算，见 columnDomainStats() 里每组的 waste。

       不用随机噪声：一幅处处均匀的热力图什么也教不了人。按并行维度分层构造，并刻意埋
       两处**形态不同**的典型故障，能不能被一眼分开正是这张矩阵存在的理由：
         · 掉队卡：一张卡全程慢 38%（降频 / 坏件），与层类型无关 → **一整行**发烫；
         · 热 EP 组：路由偏爱这一组的专家，只在 MoE 层慢 26%、dense 层完全正常

       而且掉队卡就落在 R23 所在的那个 EP 组里：组内 a2a 是同步点，于是「一张卡的毛病」
       会变成「八张卡的代价」——这一笔由域聚合面板算给你看。 */
    function stragglerRank(){
      var T = E.TOPO; if(!T) return -1;

    }

    }
    /* 一个 EP 组横跨几台机器：组员 r 在一段里按 TP 跨步排列，首尾一算就知道，不必扫全表 */

      if(!T || !c || !isFinite(Number(layer))) return 0;
      var moe = layer >= T.dense, f = 0.97 + ((r*37 + layer*11) % 13)/200;   /* 同型号卡之间 ±3% 的常态离散 */
      if(r === stragglerRank()) f *= 1.38;

      if(moe && hot && c.pp === hot.pp && c.tp === hot.tp && Math.floor(c.dp/T.ep) === hot.g) f *= 1.26;

    /* 一个 Layer 只由它所属 PP stage 的 Rank 执行。默认 128 Rank、PP=4 时，一层的比较对象是

    /* ══ 并行域：谁和谁在同一个同步点上 ══════════════════════════════════════════

    var DOMAINS = [

       选中一列（而不是一张卡）时，右栏那块读数没有锚点可依：要把该 Layer 所属 PP Stage
       里的同类组都算一遍，再回答两件事——
         · 组中位耗时最高的是哪一组（组间差异：整组摊到的活多）；
         · 组内耗时差最大的是哪一组（组内差异：有人掉队，同步点在等他）。
       这两件事的处方相反，所以分开报、也分开给点击入口：点哪一行就在矩阵里标出哪一组。 */
    /* 成员判据照本页第 9 步 commOf() 那套（同一页里「TP / EP / DP / EDP 各是哪些卡」只能有一个说法），
       差别只有一处：那里的 (dp>>3) 在这里参数化成 (dp / T.ep)。 */
    function groupKeyOf(kind, c){
      var T = E.TOPO;
      return kind === 'tp' ? c.pp + '/' + c.dp

        : c.pp + '/' + (c.dp % T.ep);   /* edp：持有同一片专家的那几张，跨 TP 片 */
    }

        : kind === 'ep' ? 'PP' + c.pp + '·TP' + c.tp + '·组' + Math.floor(c.dp/T.ep)

        if(!byKey[k]){ byKey[k] = {key:k, label:groupLabel(kind, c), anchor:c, ranks:[]}; order.push(byKey[k]); }
        byKey[k].ranks.push(c.r);
      });
      order.forEach(function(g){
        var v = g.ranks.map(function(x){ return rankLayerMs(x, layer); }).sort(function(a, b){ return a - b; });
        g.med = medianOf(v); g.max = v[v.length - 1];
        /* 组内耗时差。组里不足 4 张时中位数说明不了问题（两三个样本，中位紧挨着最大值），
           改用「最大 / 最小」的全幅：两张卡里有一张慢 38%，该读成组内差 38%，不是整组偏重。 */
        g.skew = g.ranks.length >= 4 ? (g.med > 0 ? g.max/g.med - 1 : 0) : (v[0] > 0 ? g.max/v[0] - 1 : 0);

        g.ranks.forEach(function(x){ var q = rankLayerMs(x, layer); if(q > best){ best = q; g.slowRank = x; } });

    }

    /* ══ ① 选中列的逐格热力 ═════════════════════════════════════════════════════
       量程是**相对本列中位数**的 −8%～+45%，不是这一列的 min–max：后者会让一列健康的卡
       （彼此差 2%）里最慢的那张也烧成全红，纯属吓人。相对量程下，均匀的一列整体停在色阶
       中段、看着就是均匀，只有真掉队的那张才冲到红端。
       跨层比较不归它管——那是顶尺那排耗时点的事（固定量程 4.5 ms），两种量程的分工写在域面板表头。 */
    /* 色阶落点：**中位数固定落在色带正中**（Turbo 的青绿档 = 「正常」），两侧各占半条。
       慢的一侧量程 +40%、快的一侧 −20%：卡只会被别的事拖慢，不会莫名快出一大截，两侧不必对称。
       为什么不按这一列的 min–max 归一：那会让一列健康的卡（彼此差 3%）里最慢的那张也烧成全红，纯属吓人。 */
    var HEAT_DOWN = .20, HEAT_UP = .40;
    function heatPos(ratio){
      return ratio < 1 ? clamp(.5*(1 - (1 - ratio)/HEAT_DOWN), 0, .5) : clamp(.5 + .5*(ratio - 1)/HEAT_UP, .5, 1);
    }
    /* 真·中位数（偶数个取中间两个的平均）。不能用「四舍五入取一个下标」那种近似：
       两张卡的 TP 组里那样取到的就是**最大值**，一张掉队卡会被读成「整组偏重」，归因正好反了。 */
    function medianOf(sorted){
      var n = sorted.length; if(!n) return 0;
      return n % 2 ? sorted[(n - 1)/2] : (sorted[n/2 - 1] + sorted[n/2])/2;
    }
    /* 每一层在所属 PP stage 内的中位数：两种模式都以它为基准，所以按层缓存一份（拓扑一变就作废）。 */
    /* 「全部」档一次要铺满整张矩阵，rankLayerMs 每帧会被调用几千次；
       它是 (rank, layer, 拓扑) 的纯函数，连同每层的中位数一起按拓扑签名缓存，拓扑一变整份作废。 */
    var perfCache = {sig:'', med:null, cell:null};
    function perfCacheOf(){
      var sig = E.TOPO ? [E.TOPO.layers, E.TOPO.pp, E.TOPO.dp, E.TOPO.tp, E.TOPO.ep, E.TOPO.dense].join('/') : '';
      if(perfCache.sig !== sig) perfCache = {sig:sig, med:{}, cell:{}};
      return perfCache;
    }
    function msAt(r, layer){
      var c = perfCacheOf().cell, k = r + ':' + layer;
      if(c[k] === undefined) c[k] = rankLayerMs(r, layer);
      return c[k];

    function colMedAt(layer){
      var m = perfCacheOf().med;
      if(m[layer] === undefined){

        m[layer] = medianOf(vals);
      }
      return m[layer];
    }
    /* 三种模式，同一套色义 —— 一格的颜色永远是「它比**同一层**的其他卡快还是慢」：
         全部（什么都没选）：整张矩阵铺满 → 答「全网的热点分布在哪」，一眼看出是一整行、
                            还是隔行成组、还是某几列整体偏深；
         列模式（选中一列）：固定层、只比较所属 PP stage 的 Rank → 答「这一层谁慢」；
         行模式（选中一张卡）：固定卡、沿行走 48 层，每层各按自己那一列的中位数归一
                              → 答「这张卡在哪些层上落后于同侪」。
       行模式不用「这张卡各层的绝对耗时」上色，是因为那条信息顶尺那排耗时点已经在说了（固定量程 4.5 ms），
       而且各层绝对值的高低主要来自层本身耗时高不高，与这张卡好不好无关。改成相对同层中位后：
       一张健康的卡整行是齐的中段色，掉队卡整行发烫，热 EP 组里的卡则 dense 层正常、MoE 层发烫——
       毛病的**形状**直接读得出来，这才是选中一张卡时真正想问的。 */
    /* 普通画布手势仍把「选列」和「选卡」当成两种问法；洞察里的「定位 Rank」是例外：保留当前 Layer
       作为上下文，同时选中异常 Rank。双选时当前列与目标 Rank 整行都铺热力，右栏优先展示 Rank 信息。 */
    function perfMode(){ return panelTab === 'net' && netMode === 'perf'; }
    var heatMode = null, heatLayer = null, heatRank = null, heatMed = 0;
    function heatColumnLayer(){
      /* 点算子 → 看它命中的那一列；否则看选中的 Layer 列。端点列（Emb/Norm/Head）不铺：它们不是重复层，没有「跨 rank 分布」可言 */
      if(E.hiCols){
        for(var k in E.hiCols){
          if(!E.hiCols[k] || k.charAt(0) !== 'L') continue;
          var l = parseInt(k.slice(1), 10); if(isFinite(l)) return l;
        }
        return null;
      }
      return E.selLayer && E.selLayer.type === 'layer' ? E.selLayer.layer : null;
    }
    function syncHeat(){
      heatMode = null; heatLayer = null; heatRank = null; heatMed = 0; E.cellHeat = null;
      if(!perfMode() || !E.TOPO || !E.PC.length) return;
      var l = heatColumnLayer();
      if(l !== null){
        heatLayer = l; heatMed = colMedAt(l); if(!heatMed) return;
        if(E.selRank !== null){ heatMode = 'rowcol'; heatRank = E.selRank; }
        else heatMode = 'col';
      }
      else if(E.selRank !== null){ heatMode = 'row'; heatRank = E.selRank; }
      /* 性能分析下什么都没选（左栏翻页停在「全部」）＝ 要的是全景，整张矩阵铺满，而不是一片空白 */
      else heatMode = 'all';
      E.cellHeat = cellHeatOf;
    }
    function cellHeatOf(r, col){
      if(col.type !== 'layer') return null;   /* Emb / Norm / Head 不是重复层，没有「同层的其他卡」可比 */
      if(heatMode === 'col') return col.layer === heatLayer ? performanceColor(heatPos(msAt(r, heatLayer)/heatMed), 1) : null;
      if(heatMode === 'rowcol'){
        if(r !== heatRank && col.layer !== heatLayer) return null;
        var bothMed = col.layer === heatLayer ? heatMed : colMedAt(col.layer);
        return bothMed ? performanceColor(heatPos(msAt(r, col.layer)/bothMed), 1) : null;
      }
      if(heatMode === 'row' && r !== heatRank) return null;
      var med = colMedAt(col.layer);   /* 行模式与全部档都是逐层按各自那一列的中位数归一 */
      return med ? performanceColor(heatPos(msAt(r, col.layer)/med), 1) : null;
    }

    /* ══ ③ 算子 → 通信域 ════════════════════════════════════════════════════════
       点一枚集合通信算子，问的是「这一次通信把哪些卡拴在了一起」。答案是一个 rank 集合，
       正是矩阵里那一批行——这也是这张矩阵上「这么多格子」最直接的用处：它们是域的**成员名单**。
       梯度 All-Reduce（DP / EDP）不在前向图里，没有可点的节点，只出现在域聚合表里。 */
    /* 从域聚合表里点中的那一维（'tp'|'ep'|'dp'|'edp'）。它与算子驱动的通信域是同一块叠加层的两个入口：
       算子那条自带锚点与文案、优先级更高；这条**跟着选中卡走**——换一张卡就按新锚点重算成员，
       不必回表里再点一次（「给我看这张卡的 EP 组」本来就是一条持续的诉求，不是一次性查询）。 */
    var domPick = null;
    function syncDomain(){
      if(!domPick || heatLayer === null || !E.TOPO){ E.hiDomain = null; return; }
      /* 'auto'（由点算子进来的）在这里落实成具体的一组，落实后写回 domPick —— 面板的选中态要认它 */
      if(domPick.which === 'auto'){
        var probe = columnDomainStats(domPick.kind, heatLayer);
        domPick.which = probe && probe.lag.skew > .1 ? 'lag' : 'hot';
      }
      /* 「组中位耗时最高 / 组内耗时差最大」是跟着层走的（换一层就可能是另一组），所以每次按当前层现解析，
         不把成员名单存进 domPick —— 存了就会在翻层之后指着一组过时的卡。 */
      var cs = columnDomainStats(domPick.kind, heatLayer), g = cs && cs[domPick.which];
      if(!g){ E.hiDomain = null; return; }
      domPick.label = g.label; domPick.n = g.ranks.length;
      E.hiDomain = {kind:domPick.kind, ranks:g.ranks};
    }
    var COMM_DOMAIN = {a2a_dispatch:'ep', a2a_combine:'ep', expert_pool:'ep',
                       moe_all_gather:'tp', moe_reduce_scatter:'tp',
                       attn_all_gather:'tp', attn_reduce_scatter:'tp', logits_allgather:'tp'};
    function layerPerformanceMs(layer){
      var wave = ((layer + 3)*17 % 29)/28, base = layer < E.TOPO.dense ? 2.46 : 3.18;
      return base*(.72 + .42*wave);
    }
    function drawLayerPerformanceDots(){
      if(!E.plane || !E.TOPO) return;
      var x0 = PLC.RULER_LEFT_W, y0 = PLC.RULER_TOP_H, cellW = E.plane.cellW*E.view.k;
      cx.save(); cx.beginPath(); cx.rect(x0, 0, E.W - x0, y0); cx.clip();
      E.plane.blocks.forEach(function(block){
        if(!block) return;
        block.cols.forEach(function(col, ci){
          if(col.type !== 'layer') return;
          var x = E.view.x + (block.x + ci*E.plane.cellW)*E.view.k, r = clamp(cellW*.1, 1.5, 3);
          if(x + cellW < x0 || x > E.W) return;
          cx.beginPath(); cx.arc(x + cellW/2, y0 - r - 2, r, 0, Math.PI*2);
          cx.fillStyle = performanceColor(layerPerformanceMs(col.layer), 4.5); cx.globalAlpha = .95; cx.fill();

        });
      });
      cx.restore();
    }
    /* ③ 通信域的成员名单铺在画布上：每个成员一条淡底 + 左尺边上一枚色签（域色照第 9 步的 VC，
       同一页里 TP 青 / EP 紫 / DP 蓝 / EDP 粉只有一套说法）。选中的那张卡的签更实，它是域的锚点。 */
    function drawCommDomain(){
      var d = E.hiDomain;
      if(!d || !d.ranks || !d.ranks.length || !E.plane) return;
      var x0 = PLC.RULER_LEFT_W, y0 = PLC.RULER_TOP_H, col = (RI.VC && RI.VC[d.kind]) || BLUE;
      cx.save(); cx.beginPath(); cx.rect(0, y0, E.W, E.H - y0); cx.clip();
      d.ranks.forEach(function(r){
        var row = PLN.cellRect(E, r, null);
        if(!row || row.y + row.h < y0 || row.y > E.H) return;
        var me = r === E.selRank;
        cx.fillStyle = RI.hexA(col, me ? .18 : .10);
        cx.fillRect(x0, row.y, E.W - x0, Math.max(1, row.h - 1));
        cx.fillStyle = RI.hexA(col, me ? 1 : .68);
        cx.fillRect(x0 - 4, row.y + 1, 3, Math.max(2, row.h - 3));
      });
      cx.restore();
    }
    /* ② 域聚合读数。三种状态：点了集合通信算子 → 那一个域的名单与代价；只选了 Layer 列 →
       四个域各自的分布；其余（没在性能分析、或选的是端点列）→ 收起。
       签名去重：redraw 是按帧跑的，状态没变就不碰 DOM。 */
    function fmtMs(v){ return v.toFixed(2); }
    function pct(v){ return (v >= 0 ? '+' : '−') + Math.round(Math.abs(v)*100) + '%'; }
    function domainDef(kind){ return DOMAINS.filter(function(d){ return d.k === kind; })[0] || {}; }
    function domainColor(kind){ return (RI.VC && RI.VC[kind]) || BLUE; }
    function adviceHtml(html, rank){
      return '<div class="cro-config-error c4dm-advice is-blocking is-guidance">'
        + '<p class="cro-config-error__msg"><strong class="cro-config-error__title">洞察</strong><span>' + html + '</span></p>'
        + (rank === null || rank === undefined ? '' : '<div class="cro-config-error__actions"><button type="button" class="pri" data-act="locate-rank" data-rank="' + rank + '" aria-label="定位 R' + rank + '">定位</button></div>')
        + '</div>';
    }
    /* 选中列时右栏的一块：这一维在整列上分成多少组、耗时最高的是哪一组、组内耗时差最大的是哪一组。
       两张等高卡各自可点——点谁就在矩阵里标出谁的成员。 */
    function domainBlockHtml(cs, moe){
      var def = domainDef(cs.kind), c = domainColor(cs.kind);
      var card = function(which, g, label, val, bad, basis){
        var zero = val === '+0%' || val === '−0%';
        var on = !zero && domPick && domPick.kind === cs.kind && domPick.which === which;
        return '<button type="button" class="c4dm-card' + (on ? ' is-on' : '') + (bad ? ' is-bad' : '') + (zero ? ' is-zero' : '') + '"'
          + ' data-dom="' + cs.kind + '" data-which="' + which + '" aria-pressed="' + (on ? 'true' : 'false') + '"'
          + (zero ? ' disabled aria-disabled="true"' : '')
          + ' aria-label="' + label + ' ' + esc(g.label) + '：' + basis + ' ' + val + (zero ? '，无明显差异' : '。在矩阵里标出这 ' + g.ranks.length + ' 张卡') + '">'
          + '<span class="hd"><span class="k">' + label + '</span><span class="v">' + val + '</span></span>'
          + '<span class="g">' + esc(g.label) + '</span></button>';
      };
      return '<section class="c4dm-blk" style="--dom-c:' + c + '">'
        + '<h4><em></em>' + esc(def.name) + '<span>' + cs.groups + ' 组 × ' + cs.size + ' 张'
        + (cs.kind === 'ep' && cs.nodes > 1 ? ' · 跨 ' + cs.nodes + ' 机' : '') + ' · ' + esc(def.at) + '</span></h4>'
        + '<div class="c4dm-cards">'
        + card('hot', cs.hot, '耗时最高组', pct(cs.hot.rel), cs.hot.rel > .1 && cs.hot.skew <= .1,
               '组中位比本层 PP Stage 中位')
        + card('lag', cs.lag, '组内耗时差最大', pct(cs.lag.skew), cs.lag.skew > .1,
               '最慢卡比' + (cs.lag.ranks.length >= 4 ? '组内中位' : '组内最快卡'))
        + '</div>'
        + '</section>';
    }
    function domainOffHtml(kind){
      var def = domainDef(kind);
      return '<section class="c4dm-blk is-off" style="--dom-c:' + domainColor(kind) + '">'
        + '<h4><em></em>' + esc(def.name) + '</h4><p class="c4dm-off">Dense 层不使用专家同步域</p></section>';
    }
    /* 整列口径的一句结论。优先级与逐卡口径那版一致：先组内掉队（有人拖着大家），再整组偏热（活分得不均）。 */
    function columnVerdict(all, moe){
      var lag = null, heavy = null;
      all.forEach(function(cs){
        if(!cs) return;
        if(cs.lag.skew > .1 && domainDef(cs.kind).perLayer && (!lag || cs.lag.waste > lag.lag.waste)) lag = cs;
        /* 组之所以热是因为组里混了一张掉队卡的话，它不是「负载不均」——要求组内齐平才算 */
        if(cs.hot.rel > .1 && cs.hot.skew <= .1 && (!heavy || cs.hot.rel > heavy.hot.rel)) heavy = cs;
      });
      if(lag){
        var lagBase = lag.lag.ranks.length >= 4 ? '组内中位' : '组内最快卡';
        return {html:'<b>' + esc(domainDef(lag.kind).name) + ' ' + esc(lag.lag.label) + '</b> 里 <b>R' + lag.lag.slowRank
          + '</b> 比' + lagBase + '慢 ' + pct(lag.lag.skew) + '：同步点要等它，其余 ' + (lag.lag.ranks.length - 1)
          + ' 张每过一次这一层白等约 <b>' + fmtMs(lag.lag.waste) + ' 卡·ms</b>。', rank:lag.lag.slowRank};
      }
      if(heavy){
        return {html:'<b>' + esc(domainDef(heavy.kind).name) + ' ' + esc(heavy.hot.label) + '</b> 组内齐平（'
          + pct(heavy.hot.skew) + '），但整组比本层 PP Stage 中位重 <b>' + pct(heavy.hot.rel) + '</b>：没人在等谁，'
          + '是这一组摊到的活本来就多'
          + (heavy.kind === 'ep' ? '（路由偏爱它持有的那批专家）' : '') + '。要动的是<b>负载分配</b>，不是查硬件。', rank:null};
      }
      return {html:'各维的组中位耗时差异与组内耗时差都在 ±10% 内，这一层没有木桶，也没有偏重的组。', rank:null};
    }
    function toggleDomPick(kind, which){
      if(!kind || !which) return;
      userStop();
      var same = domPick && domPick.kind === kind && domPick.which === which;
      domPick = same ? null : {kind:kind, which:which, label:'', n:0};
      sideDomSig = '';   /* 选中态写在面板里，强制重写一次 */
      renderSide(); redraw();
    }
    /* 委托绑在右栏壳上，绑一次 —— panel() 每次都重写内部 innerHTML，监听挂在行上会被冲掉 */
    function bindDomPanel(el){
      if(!el || el.dataset.domBound) return;
      el.dataset.domBound = '1';
      el.addEventListener('click', function(e){
        var locate = e.target.closest('button[data-act="locate-rank"]');
        if(locate){ locateRank(+locate.dataset.rank); return; }
        var row = e.target.closest('button.c4dm-card'); if(row) toggleDomPick(row.dataset.dom, row.dataset.which);

    function locateRank(rank){
      if(!isFinite(rank) || rank < 0 || rank >= E.PC.length) return;

      E.selRank = rank;

    /* 「全部」档的全景读数：哪张卡整体落后于同侪、哪一层耗时最高。

    function overviewStats(){
      var L = E.TOPO.layers, worstRank = null, worstRatio = 0;
      E.PC.forEach(function(c){
        var rs = [];
        var lo = c.pp*E.TOPO.lps, hi = Math.min(L, lo + E.TOPO.lps);
        for(var l = lo; l < hi; l++){ var m = colMedAt(l); if(m) rs.push(msAt(c.r, l)/m); }
        rs.sort(function(a, b){ return a - b; });
        var v = medianOf(rs);
        if(v > worstRatio){ worstRatio = v; worstRank = c.r; }
      });
      var hotLayer = 0, hotMs = 0, loMs = Infinity;
      for(var l = 0; l < L; l++){
        var m = colMedAt(l);
        if(m > hotMs){ hotMs = m; hotLayer = l; }
        if(m && m < loMs) loMs = m;
      }
      return {worstRank:worstRank, worstRatio:worstRatio - 1, hotLayer:hotLayer, hotMs:hotMs, loMs:loMs};
    }
    function overviewPanelHtml(){
      var o = overviewStats(), T = E.TOPO, bad = o.worstRatio > .1;
      var advice = bad
        ? '优先检查 <b>R' + o.worstRank + '</b>：它在各层相对同层中位普遍慢 <b>' + pct(o.worstRatio) + '</b>，先核对频率、温度与硬件状态。'
        : '暂未发现持续掉队卡；可从耗时最高的 <b>L' + o.hotLayer + '</b> 继续下钻，区分层本身计算量与卡间异常。';
      return adviceHtml(advice, bad ? o.worstRank : null)
        + '<p class="c4dm-top">' + E.PC.length + ' 张 × ' + T.layers + ' 层 · 每层取所属 PP Stage 的 ' + T.rows + ' 张卡计算耗时中位，范围 <b>'
        + fmtMs(o.loMs) + ' – ' + fmtMs(o.hotMs) + ' ms</b>；矩阵显示每张卡相对同层中位的快慢。</p>'
        + '<section class="c4dm-blk" style="--dom-c:' + BLUE + '">'
        + '<h4><em></em>全网热点<span>相对同层中位</span></h4>'
        + '<div class="c4dm-cards">'
        + '<div class="c4dm-card' + (bad ? ' is-bad' : '') + '"><span class="hd"><span class="k">最慢的卡</span><span class="v">' + pct(o.worstRatio) + '</span></span><span class="g">R'
        + o.worstRank + '</span></div>'
        + '<div class="c4dm-card"><span class="hd"><span class="k">耗时最高的层</span><span class="v">' + fmtMs(o.hotMs) + ' ms</span></span><span class="g">L' + o.hotLayer
        + '</span></div></div>'
        + '</section>'
        + '<p class="c4dm-hint">点顶尺或用左栏翻页选一层，看它的各域差异；点一格看那张卡的显存账。</p>';
    }
    function domainPanelHtml(){
      var moe = heatLayer >= E.TOPO.dense;
      var peers = layerCards(heatLayer), stage = peers.length ? peers[0].pp : Math.floor(heatLayer/E.TOPO.lps);
      var all = DOMAINS.map(function(def){ return (def.moeOnly && !moe) ? null : columnDomainStats(def.k, heatLayer); });
      var verdict = columnVerdict(all, moe);
      var lead = hiOp && COMM_DOMAIN[hiOp]
        ? '<p class="c4dm-lead" style="--dom-c:' + domainColor(COMM_DOMAIN[hiOp]) + '"><b>' + esc(opLabel(hiOp))
          + '</b> 跑在 <b>' + esc(domainDef(COMM_DOMAIN[hiOp]).name) + '</b> 上，这一层共 '
          + (columnDomainStats(COMM_DOMAIN[hiOp], heatLayer) || {}).groups + ' 组。</p>'

        {at:9000, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('.c4s[data-f="pp"] button[data-d="-1"]'); }, function(){ set('pp', 4); flash(['totalRank']); cap(1, '演示完成后把 <b>PP 8 → 4</b>：Total Rank / World Size 回到 <b>128</b>，矩阵恢复为 4 个 Stage，为下一步的 R23 内存预览保留同一份主画面。'); }, '恢复 PP'); }}]},

        {at:300, fn:function(){ DemoPointer.click(matrixTarget(R23, 'L7'), function(){ selectCell(R23, 'L7'); var m = MEM[R23]; cap(2, 'R23（stage 0 · DP 11）的显存账：五档合计 <b>' + fmt(total(m)) + ' GB</b>，卡是 64 GB——右栏放大的那张装到六成多。'); }, '点 R23 × L7'); }},
        {at:2200, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('.c4s[data-f="mbs"] button[data-d="1"]'); }, function(){ set('mbs', 2); var m = MEM[R23]; cap(2, '先把 <b>Micro Batch 1 → 2</b>：卡仍是 64 GB，但单卡激活与总显存占用随批量增大，右栏账本和占用率同步上升；当前 R23 合计 <b>' + fmt(total(m)) + ' GB</b>。'); }, '增加 Micro Batch'); }},
        {at:5200, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('select[data-f="card"]'); }, function(){ setCard('910b-32'); fadeOver(1, 800); var n = over.filter(Boolean).length;
          cap(2, '再把卡型号换成 <b>32 GB</b>：刚才增大的账本一个字节没少，只有容量壳变矮——R23 的柱子越过容量线，矩阵中共有 <b>' + n + ' 张卡</b>过线并浅红提示。'); }, '选择 32 GB 卡'); }},
        {at:8200, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('[data-act="discard-card"]'); }, function(){ discardCardChange(); cap(2, '选择<b>取消修改</b>：卡型号恢复到 64 GB，OOM 提示与红色填充退场；Micro Batch 造成的账本增量仍在，下一步开始时再统一恢复基线配置。'); }, '取消修改'); }}]},
      {end:10300, b:[
        {at:300, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('[data-pt="net"]'); }, function(){ setPanel('net'); }, '切到整网查询'); }},
        {at:1900, fn:function(){ DemoPointer.click(netTarget('final_norm'), function(){ pickOp('final_norm'); cap(3, '先点输出端的 <b>Final RMSNorm</b>：它不属于重复的 Transformer Layer，只对应矩阵中的单独 <b>Norm</b> 列，因此当前只高亮这一列。'); }, '点 Final RMSNorm'); }},
        {at:5600, fn:function(){ DemoPointer.click(netTarget('a2a_combine'), function(){ pickOp('a2a_combine'); cap(3, '再点 <b>EP Combine</b>：整网视图自动翻到包含该节点的 <b>Layer 24</b>，矩阵那一列改按<b>每张卡跑这一层的耗时</b>上色（相对全列中位）——一眼看出谁慢；右栏换成 <b>Layer 24 · 各域计算耗时差异</b>（口径是纯计算，不含通信与等待），把 TP / EP / DP / EDP 四维各自的「组中位耗时最高」与「组内耗时差最大」摊开，并自动在矩阵里标出 EP 这一维当下最值得看的那一组。'); }, '点 EP Combine'); }}]},
      {end:10300, b:[
        {at:300, fn:function(){ DemoPointer.click(matrixTarget(R23, 'L7'), function(){ selectCell(R23, 'L7'); cap(4, '从上一步高亮的 <b>L24 单列</b> 切到一个格子：选中 <b>R23 × L7</b>，接下来只查看这张卡在这一层里的专家。'); }, '点 R23 × L7'); }},
        {at:2200, fn:function(){
          var home = {x:E.view.x, y:E.view.y, k:E.view.k};
          zoomTo(R23, 'L7', 1900, function(){ at(2000, function(){ zoomBack(home, 1900); }); });
          cap(4, '放大到一格：这就是 R23 在 L7 上的计算图——Attention 五步、MoE 四步；<b>Expert Compute</b> 里是它持有的 8 个专家 <b>E24–E31</b>（EP 组 3 = DP 11 mod 8，每组 64 ÷ 8 = 8 个）。停留 2 秒后回到整网视图。');
        }}]},
      {end:12300, b:[
        {at:1200, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('.c4s[data-f="dp"] input'); }, function(){ set('dp', 4); cap(5, '4 除不尽 8：横幅升格成红色——DP、EP、Total Rank 三格描红，图形<b>暂停更新</b>、仍画上一组自洽的 128 卡；横幅给出兼容改法：EP 8 → 4；但 EP 减半意味着每卡专家翻倍，账会撑过 64 GB，所以建议同时把 PP 4 → 8 分摊层数，Total Rank 128 → 64，预计峰值约 52 GB/卡。'); }, '输入 DP = 4'); }},
        {at:6000, fn:function(){ DemoPointer.click(function(){ return conf && conf.querySelector('[data-act="apply"]'); }, function(){ applyFix(); cap(5, '一键应用：EP 降到 4、PP 升到 8，Total Rank 从 128 整体刷新为 <b>64</b>（4 × 2 × 8）；矩阵按 8 段 × 8 行完整重画，Layer 7 选择同时清除。每卡持有的专家从 8 个变成 16 个，但每卡只承载 6 层，账仍在容量线之下，没有一张卡 OOM。'); }, '一键应用'); }}]}
    ];
    function runSeg(s, then){
      reset(s); baseCaps(); if(onStage) onStage(s, true);
      var B = BEATS[s - 1];
      B.b.forEach(function(x){ at(x.at, x.fn); });
      at(B.end, then);
    }
    function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
    function stop(){ clearTimers(); cancelAnim(); DemoPointer.stop(); mode = 'idle'; }
    function userStop(){ if(mode !== 'idle'){ stop(); if(onEnd) onEnd(); } }
    function play(){
      stop(); mode = 'full';
      (function go(s){ if(s > SEG.length){ mode = 'idle'; if(onEnd) onEnd(); return; } runSeg(s, function(){ go(s + 1); }); })(1);
    }
    function showSeg(s){ stop(); mode = 'single'; runSeg(s, function(){ mode = 'idle'; if(onEnd) onEnd(); }); }
    baseCaps();
    return {mount:mount, play:play, stop:stop, showSeg:showSeg, caps:function(){ return CAPS; }, segs:SEG,
            redraw:function(){ syncConf(); renderSide(); mountNet(); redraw(); }, watch:function(f){ onStage = f; }, watchEnd:function(f){ onEnd = f; }};
  })();
  var ST4 = M4 ? M4.segs : [{lbl:'1 · 配置联动与World Size实时可视'}, {lbl:'2 · 预览 Rank 内存受配置的影响'}, {lbl:'3 · 查询计算节点分布'},
                              {lbl:'4 · 查看 Layer x Rank 的计算图和持有专家'}, {lbl:'5 · 为配置变化推荐适配方案或危险拦截'}];

  var CASES = [
    {t:'一个 Rank 出错，四步拖停整个集群',
     rail:'一个rank阻塞怎么波及全集群', st:ST1},
    {t:'集群状态全景，看形状就知道谁在拖后腿',
     rail:'集群状态热力全景', st:ST2, heat:true},
    {t:'一层里的一个热点专家，只有 stage 0 的四张卡 OOM',
     rail:'Rank 内存的动态变化监控', st:ST3, mem:true},
    {t:'改一个数，矩阵、计算图与显存账一起变',
     rail:'配置预览：改一个数，图跟着变', st:ST4, cfg:true}
  ];

  var cur = 0, stage = 4, timer = null;
  function active(){ return pageEl.dataset.tab === 'scene'; }
  function steps(){ return CASES[cur].st; }

  function railHTML(){
    return CASES.map(function(c, i){
      return '<button type="button" data-i="' + i + '" aria-current="' + (i === cur) + '">'
           + '<span class="n">' + (i + 1) + '</span>' + c.rail + '</button>';
    }).join('');
  }
  function repHTML(){
    return '<button type="button" class="rep" data-rep="1" title="播放 / 暂停" aria-label="播放 / 暂停">'
         + '<svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 3 14 9-14 9z"/></svg>'
         + '<svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>';
  }
  function stepsHTML(){
    var ST = steps();
    return repHTML() + ST.map(function(s, i){
      return '<button type="button" data-s="' + (i + 1) + '" style="--fc:' + s.c + '" class="'
           + (i + 1 <= stage ? 'done ' : '') + (i + 1 === stage ? 'cur' : '') + '">'
           + '<span class="lbl">' + s.lbl + '</span><span class="bar" role="progressbar" aria-label="步骤进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'
           + (i + 1 < stage ? '100' : '0') + '"></span></button>';
    }).join('');
  }
  /* 播放状态：'full' 全流程在播 / 'single' 手动单段播放 / 'idle' 停着；写在段控容器上，播放键的图标照它换 */
  var mode = 'idle', progressRaf = 0;
  var stepProgress = {stage:0, value:0, start:0, duration:0, playing:false};
  function stepDuration(s){
    var c = CASES[cur];
    return c.mem ? [2400, 6400, 11200, 5300, 8400][s - 1]
      : c.cfg ? [11800, 11300, 10300, 10300, 12300][s - 1]
      : c.heat ? 2100 : 1700;
  }
  function paintStepProgress(now){
    progressRaf = 0;
    if(stepProgress.playing){
      stepProgress.value = Math.min(1, ((now || performance.now()) - stepProgress.start)/stepProgress.duration);
      if(stepProgress.value >= 1) stepProgress.playing = false;
    }
    var st = document.getElementById('csSteps');
    if(st && stepProgress.stage){
      var bar = st.querySelector('button[data-s="' + stepProgress.stage + '"] .bar');
      if(bar){
        var value = stepProgress.value || 0;
        bar.style.setProperty('--progress', value);
        bar.setAttribute('aria-valuenow', String(Math.round(value*100)));
      }
    }
    if(stepProgress.playing && active()) queueStepProgress();
  }
  function queueStepProgress(){ if(!progressRaf) progressRaf = requestAnimationFrame(paintStepProgress); }
  function beginStepProgress(s, duration){
    stepProgress = {stage:s, value:0, start:performance.now(), duration:duration || stepDuration(s), playing:true};
    queueStepProgress();
  }
  function finishStepProgress(){ stepProgress.value = 1; stepProgress.playing = false; queueStepProgress(); }
  function freezeStepProgress(){
    if(stepProgress.playing) stepProgress.value = Math.min(1, (performance.now() - stepProgress.start)/stepProgress.duration);
    stepProgress.playing = false;
  }
  function setStepProgress(s, value){
    stepProgress = {stage:s, value:value == null ? 1 : value, start:0, duration:0, playing:false};
  }
  function setMode(m){
    mode = m; var st = document.getElementById('csSteps'); if(st) st.dataset.play = m;
    queueStepProgress();
  }

  function render(){
    railEl.innerHTML = railHTML();
    var c = CASES[cur];
    mainEl.classList.toggle('mem', !!c.mem);
    mainEl.classList.toggle('cfg', !!c.cfg);
    var head = '<div class="cs-head"><h1>' + c.rail + '</h1><div class="cs-steps" id="csSteps"></div>'
      + '<p class="cs-cap" id="csCap"></p></div>'
    var fig = '<div class="cs-figwrap' + (c.heat ? ' heat' : '') + (c.mem ? ' mem' : '') + (c.cfg ? ' cfg' : '') + '" id="csFig"></div>';
    /* 四个案例的标题 / 段控 / 文案都独占整行。带面板的案例在下方另起等高工作区：
       案例三是「主内容 + 详情」，案例四是「配置 + 主内容 + 详情」。 */
    mainEl.innerHTML = c.mem ? head + '<div class="cs-work mem">' + fig + '<aside class="cs3-side" id="cs3side" aria-label="选中Rank详情"></aside></div>'
      : c.cfg ? head + '<div class="cs-work cfg"><aside class="cs4-conf" id="cs4conf" aria-label="配置"></aside>' + fig + '<aside class="cs3-side" id="cs4side" aria-label="选中Rank详情"></aside></div>'
      : head + fig;
    paint();
    if(active()) play();
  }
  /* 图重画（尺寸变了要重排），文字与段控只换内容 */
  function paint(){
    var fig = document.getElementById('csFig'), c = CASES[cur]; if(!fig) return;
    if(c.mem){
      /* 案例三自己管画布；段变了它回调 sync 换文字（见 M3.watch）*/
      if(M3) M3.mount(fig);
      else fig.innerHTML = '<div class="cs-todo">这一案要借「Rank 的设计表达」那套卡阵，它没加载出来。</div>';
      return;
    }
    if(c.cfg){
      if(M4) M4.mount(fig);
      else fig.innerHTML = '<div class="cs-todo">这一案要借第 10 步那块展平画布（RI.plane），它没加载出来。</div>';
      return;
    }
    fit();
    if(c.heat){
      fig.innerHTML = '<div><div class="cs-vtabs" id="csVtabs" role="tablist" aria-label="热力度量">'
        + '<button type="button" role="tab" data-v="busy">按计算时间</button><button type="button" role="tab" data-v="idle">按空闲时间</button><span class="knob" aria-hidden="true"></span></div>'
        + planeHTML({cls:'heat', band:{stage:SLOW_S, k0:SLOW_K0, k1:SLOW_K1, label:''}})
        + '<div class="cs-legend" id="csLegend"></div></div>';
    }else{
      fig.innerHTML = planeHTML({cls:'s' + stage, cell:cell1, hotLayer:FL, hotDP:11, marks:MK1});
    }
    sync();
  }
  /* 热力案例：每一段重算 1536 格的底色（inline style），每一格自己从旧色渐到新色（不逐列错开，
     扫描是传播案例的语言，这里变的是读数）；色阶图例跟着这一段的度量换文字 */
  function fillHeat(){
    var p = document.getElementById('csPlane'), lg = document.getElementById('csLegend'), band = document.getElementById('csBand');
    if(!p) return;
    var cells = p.querySelectorAll('.cs-cell'), i = 0;
    for(var s = 0; s < 4; s++) for(var k = 0; k < G.rows; k++) for(var ci = 0; ci < G.cols; ci++)
      cells[i++].style.background = fill2(s*32 + k, s*12 + ci, stage);
    var m = stage ? ST2[stage - 1] : null;
    if(band){ band.classList.toggle('on', !!(m && m.band)); if(m && m.band) band.firstChild.textContent = m.band; }
    /* 集群图上方那两枚视图页签：播到第四段时它自己切到「空闲时间」，示意这是换了个视图 */
    var vt = document.getElementById('csVtabs');
    if(vt){
      vt.classList.toggle('idle', !!m && m.view === 'idle');
      vt.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-selected', String(!!m && b.dataset.v === m.view)); });
    }
    if(lg){
      lg.innerHTML = m ? '<span class="nm">' + m.metric + '</span><span class="lo">' + m.rg[0].toFixed(1) + '</span>'
        + '<span class="bar" style="background:' + rampCSS() + '"></span><span class="hi">' + m.rg[1].toFixed(1) + ' ' + m.unit + '</span>' : '';
    }
  }
  function sync(){
    var p = document.getElementById('csPlane'), cap = document.getElementById('csCap'), st = document.getElementById('csSteps'), c = CASES[cur];
    if(c.heat) fillHeat();
    else if(p){
      p.className = 'cs-plane s' + stage;
      Array.prototype.forEach.call(p.querySelectorAll('[data-mk]'), function(el){ el.classList.toggle('on', +el.dataset.mk === stage); });
    }
    if(cap) cap.innerHTML = stage ? (c.mem && M3 ? M3.caps()[stage - 1] : c.cfg && M4 ? M4.caps()[stage - 1] : (c.st[stage - 1].cap || '')) : '';
    if(st){ st.innerHTML = stepsHTML(); st.dataset.play = mode; queueStepProgress(); }
  }
  function stop(){
    if(timer){ clearTimeout(timer); timer = null; }
    freezeStepProgress();
    DemoPointer.stop(); if(M3) M3.stop(); if(M4) M4.stop(); setMode('idle');
  }
  function showCaseStage(next, done){
    /* 案例二第四段不是数据自己突变，而是用户换了度量：先明确演示点击，再换图。 */
    if(CASES[cur].heat && next === 4){
      DemoPointer.click('#csVtabs button[data-v="idle"]', function(){ stage = next; sync(); if(done) done(); }, '切到空闲时间');
    } else { stage = next; sync(); if(done) done(); }
  }
  /* 分段动效：传播案例从空图开始一段一段亮起来；热力案例直接站在「健康运行中」那一幅上
     （第一幅是日常态，不该有从左铺到右的扫描——扫描是留给「问题出现」的），从第二段起才过渡 */
  function play(){
    stop();
    /* 案例三不是分段定时器，是一根连续走的游标：段是从游标位置读出来的 */
    setMode('full');
    if(CASES[cur].mem){ if(M3) M3.play(); return; }
    if(CASES[cur].cfg){ if(M4) M4.play(); return; }
    var heat = CASES[cur].heat, n = steps().length, duration = heat ? 2100 : 1700;
    function holdStep(s){
      beginStepProgress(s, duration);
      timer = setTimeout(function(){
        timer = null; finishStepProgress();
        if(s < n) showCaseStage(s + 1, function(){ holdStep(s + 1); });
        else setMode('idle');
      }, duration);
    }
    if(heat){ stage = 1; syncInstant(); holdStep(1); }
    else{
      stage = 0; setStepProgress(0, 0); sync();
      timer = setTimeout(function(){ timer = null; showCaseStage(1, function(){ holdStep(1); }); }, 420);
    }
  }
  /* 点段控：只播这一段一次——先瞬间退回上一段的样子，再过渡到这一段，走完后停在最终画面。
     热力案例的第一段是日常态，本来就没有过渡可播，点击后直接定格。 */
  function playStepOnce(s){
    stop(); setMode('single');
    var heat = CASES[cur].heat, duration = heat ? 2100 : 1700;
    if(heat && s === 1){ stage = 1; setStepProgress(1, 1); sync(); setMode('idle'); return; }
    stage = s - 1; syncInstant();
    timer = setTimeout(function(){
      timer = null;
      showCaseStage(s, function(){
        beginStepProgress(s, duration);
        timer = setTimeout(function(){ timer = null; finishStepProgress(); setMode('idle'); }, duration);
      });
    }, 420);
  }
  /* 关掉背景色过渡填一遍，下一帧再把过渡打开 */
  function syncInstant(){
    var p = document.getElementById('csPlane');
    if(p) p.classList.add('nt');
    sync();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(p) p.classList.remove('nt'); }); });
  }

  railEl.addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]'); if(!b) return;
    stop(); cur = +b.dataset.i; stage = (CASES[cur].st || []).length; render(); writeQ();
  });
  mainEl.addEventListener('click', function(e){
    /* 播放键：全流程播着就暂停；停着或单段播放中就回到全流程从头播 */
    if(e.target.closest('button[data-rep]')){ if(mode === 'full') stop(); else play(); return; }
    var v = e.target.closest('button[data-v]');
    /* data-v 是案例二的「计算 / 空闲」段控；案例三的泳道 / Layer 页签也带 data-v，那是 M3 自己管的（setView），别在这里把它的游标停掉 */
    if(v){
      if(CASES[cur].mem || CASES[cur].cfg) return;
      stop(); stage = v.dataset.v === 'idle' ? 4 : Math.min(Math.max(stage, 1), 3);
      setStepProgress(stage, 1); sync(); return;
    }
    var b = e.target.closest('button[data-s]');
    if(b){
      if(CASES[cur].mem){ if(M3){ M3.showSeg(+b.dataset.s); setMode('single'); } return; }
      if(CASES[cur].cfg){ if(M4){ M4.showSeg(+b.dataset.s); setMode('single'); } return; }
      playStepOnce(+b.dataset.s);
    }
  });
  function writeQ(){
    try{ var q = new URLSearchParams(location.search);
      if(cur) q.set('case', String(cur + 1)); else q.delete('case');
      var s = q.toString(); history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
    }catch(e){}
  }
  /* 页签切回来 / 窗口变化都要重量一次尺寸；不在这一页时不跑动效 */
  if(tabsEl) tabsEl.addEventListener('click', function(){
    setTimeout(function(){ if(active()){ paint(); play(); } else stop(); }, 0);
  });
  var rz = null;
  window.addEventListener('resize', function(){
    if(!active()) return;
    clearTimeout(rz); rz = setTimeout(paint, 120);
  });
  /* 热力的色阶分主题，切主题后把当前这一段重填一遍（段控条的颜色也随之换） */
  var themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.addEventListener('click', function(){
    setTimeout(function(){
      if(CASES[cur].mem){ if(M3){ M3.redraw(); sync(); } return; }
      if(CASES[cur].cfg){ if(M4){ M4.redraw(); sync(); } return; }
      if(!CASES[cur].heat) return;
      ST2.forEach(function(s, i){ s.c = heatColor([.28, .48, .85, .62][i]); });
      sync();
    }, 0);
  });

  function trackAnimatedStage(st, restart){
    stage = st;
    if(restart || st !== stepProgress.stage || !stepProgress.playing) beginStepProgress(st);
    sync();
  }
  if(M3){ M3.watch(trackAnimatedStage); M3.watchEnd(function(){ finishStepProgress(); setMode('idle'); }); }
  if(M4){ M4.watch(trackAnimatedStage); M4.watchEnd(function(){ finishStepProgress(); setMode('idle'); }); }
  var q0 = new URLSearchParams(location.search), ci = parseInt(q0.get('case'), 10);
  if(isFinite(ci) && ci >= 1 && ci <= CASES.length) cur = ci - 1;
  if(CASES[cur].st) stage = CASES[cur].st.length;
  render();
})();
</script>
</body>
