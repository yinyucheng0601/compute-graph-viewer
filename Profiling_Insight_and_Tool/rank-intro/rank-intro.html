  .comm-issue-hero strong{color:var(--bad);font:850 30px/1 var(--mono);letter-spacing:-.04em;white-space:nowrap}
  .comm-issue-hero b{display:block;color:var(--fg);font:750 11.5px/1.35 var(--sans)}
  .comm-issue-hero span{display:block;margin-top:3px;color:var(--fg3);font:500 10px/1.35 var(--sans)}
  .comm-route-chart{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;height:98px;align-items:end;padding-top:4px}
  .comm-route-col{display:grid;grid-template-rows:1fr auto auto;gap:2px;height:100%;align-items:end;color:var(--fg3);font:600 7.5px/1 var(--mono);text-align:center}
  .comm-route-bar{position:relative;justify-self:center;width:56%;height:100%;min-height:18px;border-radius:3px 3px 1px 1px;background:rgba(var(--fgrgb),.05);overflow:hidden}
  .comm-route-bar i{position:absolute;inset:auto 0 0;height:0;border-radius:3px 3px 1px 1px;background:color-mix(in srgb,var(--ep) 78%,var(--fg))}
  .comm-route-col.is-hot .comm-route-bar{outline:1px solid var(--bad);outline-offset:1px}
  .comm-route-col.is-hot .comm-route-bar i{background:var(--bad)}
  .comm-route-col b{color:var(--fg2);font-weight:750}
  .comm-route-col.is-hot b,.comm-route-col.is-hot span{color:var(--bad)}
  .comm-link-evidence{display:grid;gap:5px}
  .comm-link-row{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;background:var(--bg2)}
  .comm-link-row>span{color:var(--fg3);font:650 9.5px/1.3 var(--mono)}
  .comm-link-track{height:7px;overflow:hidden;border-radius:999px;background:rgba(var(--fgrgb),.07)}
  .comm-link-track i{display:block;width:var(--link-pct);height:100%;border-radius:inherit;background:var(--link-c,var(--dp))}
  .comm-link-row>b{color:var(--fg);font:750 10px/1.2 var(--mono);white-space:nowrap}
  .comm-link-row.is-bad{box-shadow:inset 2px 0 0 var(--bad)}
  .comm-link-row.is-bad .comm-link-track i,.comm-link-row.is-bad>b{--link-c:var(--bad);color:var(--bad)}

  /* Infra 诊断页签借右侧显存详情面板展示四层内存账与异常 Rank 名单。 */
  .memdetail.is-observer{padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow-x:hidden}
  .memdetail.is-observer .md-head{position:static;flex:none;align-items:center;min-height:28px;margin:0;padding:0;background:none;border-bottom:0}
  .memdetail.is-observer .md-kicker{display:none}
  .memdetail.is-observer .md-title{font-size:15px}
  .mem-observer{display:flex;flex-direction:column;color:var(--fg2);font:400 12px/1.55 var(--sans)}
  .mem-observer-intro{margin:0;color:var(--fg2)}
  /* 峰值 / GAP 右栏是一条“事故怎么发生”的证据链，不再是平铺指标卡。
     每段由细分隔线串起来，只有主结论使用一块语义底色。 */
  .mem-story-section{display:grid;gap:9px;padding:14px 0;border-top:1px solid var(--border-subtle,var(--line))}
  .mem-story-section:first-child{padding-top:0;border-top:0}
  .mem-story-kicker{color:var(--bad);font:700 10px/1.25 var(--sans);letter-spacing:.08em;text-transform:uppercase}
  .mem-story-hero{padding:12px;border-radius:var(--radius-lg);background:color-mix(in srgb,var(--bad) 8%,var(--bg2))}
  .mem-story-hero h3{margin:0;color:var(--fg);font:750 16px/1.4 var(--sans)}
  .mem-story-hero p{margin:7px 0 0;color:var(--fg2);font:400 13px/1.6 var(--sans)}
  .mem-story-pulse{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end;margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--bad) 22%,var(--line))}
  .mem-story-pulse span{color:var(--fg3);font:600 10px/1.3 var(--sans)}
  .mem-story-pulse strong{grid-row:1/3;grid-column:2;color:var(--bad);font:850 24px/1 var(--mono);letter-spacing:-.04em;white-space:nowrap}
  .mem-story-pulse b{color:var(--fg);font:650 11px/1.35 var(--sans)}
  .mem-story-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .mem-story-head b{color:var(--fg);font:750 12px/1.35 var(--sans)}
  .mem-story-head span{color:var(--fg3);font:600 10px/1.3 var(--mono)}
  .mem-story-flow{display:grid;gap:0;margin:0;padding:0;list-style:none;counter-reset:story}
  .mem-story-flow li{counter-increment:story;position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:0 0 13px;color:var(--fg2);font:400 12px/1.5 var(--sans)}
  .mem-story-flow li:last-child{padding-bottom:0}
  .mem-story-flow li::before{content:counter(story);position:relative;z-index:1;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bg2);color:var(--fg2);font:750 10px/1 var(--mono)}
  .mem-story-flow li:not(:last-child)::after{content:"";position:absolute;left:10.5px;top:22px;bottom:0;width:1px;background:var(--line)}
  .mem-story-flow li b{display:block;margin-bottom:2px;color:var(--fg);font-weight:700}
  .mem-story-flow li span{display:block;color:var(--fg3)}
  .mem-story-ledger{display:grid;gap:8px}
  .mem-story-capacity{position:relative;display:flex;height:30px;overflow:hidden;border-radius:var(--radius-sm);background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
  .mem-story-capacity i{display:block;min-width:0;height:100%;transition:width .16s linear}
  .mem-story-capacity i[data-ledger="allocated"]{background:var(--success)}
  .mem-story-capacity i[data-ledger="delayed"]{background:var(--warning)}
  .mem-story-capacity i[data-ledger="idle"]{background:var(--accent)}
  .mem-story-capacity i[data-ledger="other"]{background:var(--bad)}
  .mem-story-capacity i[data-ledger="headroom"]{background:transparent}
  .mem-story-capacity::after{content:"HBM";position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--fg3);font:700 8px/1 var(--mono);mix-blend-mode:difference}
  .mem-story-formula{display:flex;justify-content:space-between;gap:8px;color:var(--fg3);font:600 10px/1.35 var(--mono)}
  .mem-story-formula b{color:var(--fg);font-weight:750}
  .mem-story-ledger-list{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
  .mem-story-ledger-row{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:6px;align-items:center;min-width:0;color:var(--fg3);font:600 10px/1.3 var(--sans)}
  .mem-story-ledger-row i{width:8px;height:8px;border-radius:2px;background:var(--lc)}
  .mem-story-ledger-row[data-ledger-row="allocated"]{--lc:var(--success)}
  .mem-story-ledger-row[data-ledger-row="delayed"]{--lc:var(--warning)}
  .mem-story-ledger-row[data-ledger-row="idle"]{--lc:var(--accent)}
  .mem-story-ledger-row[data-ledger-row="other"]{--lc:var(--bad)}
  .mem-story-ledger-row b{color:var(--fg);font:750 10.5px/1.2 var(--mono);white-space:nowrap}
  .mem-story-ledger-row.is-focus span,.mem-story-ledger-row.is-focus b{color:var(--bad)}
  .mem-story-meaning{padding:10px;border-radius:var(--radius-md);background:var(--bg2);color:var(--fg2);font:400 12px/1.55 var(--sans)}
  .mem-story-meaning b{color:var(--fg);font-weight:750}
  .mem-story-checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
  .mem-story-checks li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:7px;color:var(--fg2);font:400 12px/1.5 var(--sans)}
  .mem-story-checks li::before{content:'→';color:var(--fg3);font:700 11px/1.6 var(--mono)}
  .mem-story-boundary{margin:0;color:var(--fg3);font:400 11px/1.55 var(--sans)}
  .mem-observer-phase{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--fg3);font:600 10px/1.3 var(--mono)}
  .mem-observer-phase b{color:var(--fg);font-weight:750}
  .mem-observer-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mem-observer-metric{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
  .mem-observer-metric span{color:var(--fg3);font:600 10px/1.25 var(--sans)}
  .mem-observer-metric b{color:var(--fg);font:800 13px/1.2 var(--mono);white-space:nowrap}
  .mem-observer-metric small{grid-column:1/-1;color:var(--fg3);font:500 9.5px/1.3 var(--sans)}
  .mem-observer-gap{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mem-observer-gap>div{padding:8px 9px;border-radius:8px;background:var(--bg2)}
  .mem-observer-gap span{display:block;color:var(--fg3);font:600 10px/1.2 var(--sans)}
  .mem-observer-gap b{display:block;margin-top:3px;color:var(--fg);font:800 13px/1.2 var(--mono)}
  .mem-observer-ranks{display:grid;gap:5px}
  .mem-observer-ranks h4{margin:0 0 2px;color:var(--fg);font:700 11px/1.35 var(--sans)}
  .mem-observer-rank{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg2);cursor:pointer;text-align:left}
  .mem-observer-rank:hover{border-color:rgba(var(--fgrgb),.28);background:var(--bg2)}
  .mem-observer-rank.is-on{border-color:var(--obc,var(--primary));box-shadow:inset 2px 0 0 var(--obc,var(--primary));background:color-mix(in srgb,var(--obc,var(--primary)) 8%,var(--bg))}
  .mem-observer-rank>b{color:var(--obc,var(--fg));font:800 11px/1 var(--mono)}
  .mem-observer-rank>span{min-width:0;color:var(--fg2);font:600 10.5px/1.3 var(--sans)}
  .mem-observer-rank>small{color:var(--fg3);font:600 9px/1.2 var(--mono);white-space:nowrap}
  .mem-observer-verdict{padding:9px 10px;border-left:2px solid var(--obc,var(--primary));background:var(--bg2);color:var(--fg2)}
  .mem-observer-verdict b{color:var(--fg);font-weight:750}
  .mem-observer-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .mem-observer-section-head b{color:var(--fg);font:750 11px/1.3 var(--sans)}
  .mem-observer-section-head span{color:var(--fg3);font:600 9px/1.3 var(--mono)}
  .mem-observer-results{display:grid}
  .mem-observer-result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:54px;padding:9px 6px;border:0;border-top:1px solid var(--border-subtle,var(--line));border-radius:0;background:none;color:var(--fg2);cursor:pointer;text-align:left}
  .mem-observer-result:first-child{border-top:0}
  .mem-observer-result:hover{background:var(--bg2)}
  .mem-observer-result.is-on{border-radius:var(--radius-md);background:color-mix(in srgb,var(--bad) 7%,var(--bg2))}
  .mem-observer-result-copy{min-width:0}
  .mem-observer-result-copy>b{display:block;color:var(--fg);font:700 12px/1.35 var(--sans)}
  .mem-observer-result-copy>small{display:block;margin-top:3px;color:var(--fg3);font:400 11px/1.4 var(--sans)}
  .mem-observer-result>strong{align-self:center;color:var(--bad);font:800 11px/1.2 var(--mono);white-space:nowrap}
  .mem-observer-heat{display:grid;gap:7px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  .mem-observer-heat-head{display:flex;align-items:flex-start;gap:8px}
  .mem-observer-heat-head b{color:var(--fg);font:750 11px/1.3 var(--sans)}
  .mem-observer-grid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px}
  .mem-observer-cell{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1.12;border:1px solid color-mix(in srgb,var(--line) 72%,transparent);border-radius:3px;background:rgb(13,30,66);color:rgba(255,255,255,.72);font:650 7px/1 var(--mono)}
  .mem-observer-cell.is-selected{z-index:1;border-color:var(--fg);box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--fg)}
  .mem-observer-cell.is-peak{z-index:2;border-color:var(--bad);box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--bad);color:#fff;font-weight:850}
  .mem-observer-heat-legend{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;color:var(--fg3);font:600 8.5px/1 var(--sans)}
  .mem-observer-heat-legend i{height:5px;border-radius:999px;background:linear-gradient(90deg,rgb(13,30,66) 0%,rgb(38,86,178) 22%,rgb(104,78,196) 44%,rgb(176,66,148) 64%,rgb(226,68,84) 82%,rgb(255,124,46) 100%)}

  /* OOM 页签的 R23 / L7 热点专家根因面板。 */
  .oom-observer{gap:10px}
  .oom-overrun{display:flex;align-items:baseline;justify-content:center;gap:3px;margin:32px 0 6px;color:var(--bad);white-space:nowrap}
  .oom-overrun span{font:400 16px/1 var(--sans)}
  .oom-overrun b{font:800 22px/1 var(--sans);letter-spacing:0}
  .oom-cause-flow{position:relative;display:grid;gap:24px}
  .oom-cause{position:relative;z-index:1;display:grid;gap:7px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  .oom-cause:not(:last-child)::before{content:'';position:absolute;z-index:2;left:20.5px;bottom:-24px;width:1px;height:24px;background:color-mix(in srgb,var(--fg3) 52%,var(--line));pointer-events:none}
  .oom-cause:not(:last-child)::after{content:'';position:absolute;z-index:3;left:17.5px;bottom:-23px;width:6px;height:6px;border:solid color-mix(in srgb,var(--fg3) 76%,var(--line));border-width:0 1.2px 1.2px 0;transform:rotate(45deg);pointer-events:none}
  .oom-cause-head{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:7px;align-items:center}
  .oom-cause-head>i{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--fg3);font:750 10px/1 var(--mono)}
  .oom-cause-head b{color:var(--fg);font:750 11px/1.25 var(--sans)}
  .oom-cause-head .oom-cause-prefix{color:var(--fg3);font-weight:400}
  .oom-cause-head strong{color:var(--fg2);font:750 10.5px/1.2 var(--mono);white-space:nowrap}
  .oom-cause p{margin:0;color:var(--fg3);font:400 10px/1.45 var(--sans)}
  .oom-route-note{display:block;color:var(--fg3);font:400 9px/1.2 var(--sans)}
  .oom-reserve{display:grid;gap:8px}
  .oom-reserve-head{display:flex;align-items:baseline;justify-content:flex-start;gap:8px;color:var(--fg2);font:650 9px/1.25 var(--sans)}
  .oom-reserve-head b{color:inherit;font-weight:650}
  .oom-reserve-chart{padding:2px 2px 20px}
  .oom-reserve-track{position:relative;display:flex;align-items:start;gap:4px;height:30px;overflow:visible}
  .oom-reserve-group{display:grid;grid-template-rows:14px auto;gap:4px;flex:var(--group-mb) 1 0;min-width:0}
  .oom-reserve-cells{display:flex;gap:1px;height:14px}
  .oom-reserve-cells i{display:block;flex:var(--cell-mb) 1 0;min-width:0;border:1px solid color-mix(in srgb,var(--success) 42%,var(--line));border-radius:2px;background:color-mix(in srgb,var(--success) 62%,var(--bg))}
  .oom-reserve-cells i.is-remaining{border-color:color-mix(in srgb,var(--bad) 62%,var(--line));background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 10%,var(--bg)) 0 3px,color-mix(in srgb,var(--bad) 22%,var(--bg)) 3px 5px)}
  .oom-reserve-group b{overflow:hidden;color:var(--fg2);font:650 7px/1 var(--mono);text-align:center;text-overflow:ellipsis;white-space:nowrap}
  .oom-reserve-fail{position:absolute;right:0;top:34px;color:var(--bad);font:700 8px/1 var(--sans);white-space:nowrap}
  .oom-route-chart{display:grid;grid-template-columns:repeat(var(--oom-cols,8),1fr);gap:4px;height:86px;align-items:end;padding-top:4px}
  .oom-route-chart.is-layer{gap:2px;height:80px}
  .oom-expert-map{display:grid;gap:4px}
  .oom-route-chart.is-expert{position:relative;grid-template-columns:repeat(64,minmax(0,1fr));gap:1px;height:76px;padding-top:15px}
  .oom-route-chart.is-expert .oom-route-col{display:block;position:relative;height:100%}
  .oom-route-chart.is-expert .oom-route-bar{width:100%;min-height:8px}
  .oom-route-chart.is-expert .oom-route-col b,.oom-route-chart.is-expert .oom-route-col small{display:none}
  .oom-expert-hot-label{position:absolute;z-index:3;left:43%;top:1px;transform:translateX(-50%);color:var(--bad);font:750 7.5px/1 var(--mono);white-space:nowrap}
  .oom-expert-groups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px}
  .oom-expert-groups span{display:grid;gap:3px;color:var(--fg3);font:650 7.5px/1 var(--mono);text-align:center}
  .oom-expert-groups i{display:block;height:4px;border:1px solid color-mix(in srgb,var(--fg3) 52%,var(--line));border-top:0}
  .oom-route-col{display:grid;grid-template-rows:1fr auto auto;gap:2px;height:100%;align-items:end;color:var(--fg3);font:600 7.5px/1 var(--mono);text-align:center}
  .oom-route-chart.is-layer .oom-route-col{font-size:6.5px}
  .oom-route-bar{position:relative;justify-self:center;width:16.667%;height:100%;min-height:20px;border-radius:3px 3px 1px 1px;background:rgba(var(--fgrgb),.05);overflow:hidden}
  .oom-route-bar i{position:absolute;left:0;right:0;bottom:0;height:var(--route-h);transform-origin:bottom;background:rgba(var(--fgrgb),.30);border-radius:3px 3px 1px 1px;animation:oom-route-rise 1.2s linear both}
  .oom-route-col.is-future{opacity:.34}
  .oom-route-col.is-future .oom-route-bar{border:1px dashed var(--line);background:none}
  .oom-route-col.is-alert .oom-route-bar{animation:oom-route-outline 1ms step-end var(--route-alert-delay) both}
  .oom-route-col.is-alert .oom-route-bar i{animation:oom-route-rise 1.2s linear both,oom-route-alert 1ms step-end var(--route-alert-delay) both}
  .oom-route-col b{color:var(--fg2);font:750 7.5px/1 var(--mono)}
  .oom-route-col.is-alert b{animation:oom-route-value-alert 1ms step-end var(--route-alert-delay) both}
  .oom-route-col small{color:var(--fg3);font:650 7.5px/1 var(--mono)}
  .oom-route-col.is-alert small{animation:oom-route-value-alert 1ms step-end var(--route-alert-delay) both}
  @keyframes oom-route-rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes oom-route-alert{from{background:rgba(var(--fgrgb),.30)}to{background:var(--bad)}}
  @keyframes oom-route-outline{from{outline:1px solid transparent;outline-offset:1px}to{outline:1px solid color-mix(in srgb,var(--bad) 72%,var(--line));outline-offset:1px}}
  @keyframes oom-route-value-alert{from{color:var(--fg2)}to{color:var(--bad)}}
  @media (prefers-reduced-motion:reduce){.oom-route-bar i,.oom-route-col.is-alert .oom-route-bar,.oom-route-col.is-alert .oom-route-bar i,.oom-route-col.is-alert b,.oom-route-col.is-alert small{animation-duration:1ms;animation-delay:0ms}}
  .oom-footnote{margin:0 0 22px;padding:0;color:var(--fg2);font:400 10px/1.5 var(--sans)}
  .oom-footnote b{color:var(--fg);font-weight:750}

  /* 第 8 / 9 步底部的 mem-cycle 共用一根 step 时钟：Layer 视图看内存生命期，泳道视图看同帧的算子 / 通信执行。 */
  .mem-cycle{position:absolute;left:14px;right:0;bottom:0;z-index:6;height:176px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
  .mem-cycle[hidden]{display:none}
  .stage .mem-cycle canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .mem-cycle iframe{position:absolute;inset:0;display:none;width:100%;height:100%;border:0;opacity:0;transition:opacity 140ms ease}
  .mem-cycle[data-view="lane"] iframe{display:block}
  .mem-cycle[data-view="lane"][data-lane-ready="1"] iframe{opacity:1}
  .mem-cycle[data-view="lane"] canvas{display:none}
  .mem-cycle-views{position:absolute;left:7px;top:5px;z-index:5;background:var(--bg);border-radius:12px}
  .mem-cycle-views.cs-vtabs{height:24px;margin:0}
  .mem-cycle-cursor{position:absolute;inset:0;z-index:4;pointer-events:none}
  .mem-cycle-cursor[hidden],.mem-cycle[data-view="layer"] .mem-cycle-cursor{display:none}
  .mem-cycle-cursor>i{position:absolute;top:42px;bottom:0;width:0;border-left:1.5px solid var(--dp);opacity:.85;transform:translateX(-.75px)}
  .mem-cycle-cursor>i::before{content:'';position:absolute;top:-3px;left:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--dp)}
  .mem-cycle-bar{position:absolute;top:5px;left:7px;right:7px;z-index:3;height:24px;display:flex;align-items:center;pointer-events:none}
  .mem-cycle-title{visibility:hidden;color:var(--fg2);font:650 11px/1 var(--sans)}
  .mem-cycle-toggle{pointer-events:auto;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg2);font:600 11px/1 var(--sans);cursor:pointer}
  .mem-cycle-toggle:hover{color:var(--fg);border-color:rgba(var(--fgrgb),.3)}
  .mem-cycle-toggle:focus-visible{outline:none;box-shadow:0 0 0 3px var(--state-focus)}
  .mem-cycle-toggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mem-cycle.is-collapsed{height:38px}
  .stage .mem-cycle.is-collapsed canvas,.mem-cycle.is-collapsed iframe,.mem-cycle.is-collapsed .mem-cycle-cursor,.mem-cycle.is-collapsed .mem-cycle-views{display:none}
  .mem-cycle.is-collapsed .mem-cycle-bar{inset:0;height:auto;padding:0 10px;pointer-events:auto;cursor:pointer}
  .mem-cycle.is-collapsed .mem-cycle-title{visibility:visible}
  .mem-cycle.is-collapsed .mem-cycle-toggle{width:28px;border:0;background:transparent;padding:0}
  .mem-cycle.is-collapsed .mem-cycle-toggle svg{transform:rotate(180deg)}
  .lv-bubble-tip{position:fixed;z-index:140;max-width:310px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--warning) 45%,var(--line));border-radius:8px;background:var(--bg);box-shadow:0 10px 28px rgba(0,0,0,.22);color:var(--fg2);pointer-events:none;font:400 11px/1.5 var(--sans)}
  .lv-bubble-tip[hidden]{display:none}
  .lv-bubble-tip b{display:block;margin-bottom:2px;color:var(--warning);font-weight:750}
  /* 泳道在底部 iframe 中运行；详情气泡提升到页面 body 后，才能越过 176px 面板的物理边界。 */
  .mem-lane-tooltip-portal{position:fixed;z-index:200;width:min(460px,calc(100vw - 16px));min-width:min(320px,calc(100vw - 16px));max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);box-shadow:0 10px 28px rgba(0,0,0,.24);color:var(--fg);pointer-events:none;font:400 11px/1.5 var(--sans)}
  .mem-lane-tooltip-portal[hidden]{display:none}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__title{margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--fg);font:700 11.5px/1.5 var(--mono)}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__row{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:start;gap:12px}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__key{min-width:0;color:var(--fg3);font-size:10px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__value{min-width:0;color:var(--fg);font-family:var(--mono);overflow-wrap:anywhere}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__value.is-bad{color:var(--bad)}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__value.is-warn{color:var(--warning)}
  .mem-lane-tooltip-portal .pto-swimlane-task-tooltip__value.is-ok{color:var(--success)}
  /* canvas 是 replaced element，height:auto 时不会由 top/bottom 拉伸；明确扣掉底栏高度，
     才能让主视图区的盒子尺寸和相机中心真正响应进度看板的展开 / 折叠。 */
  .stage.mem-cycle-on #cv{bottom:auto;height:calc(100% - 190px)}
  .stage.mem-cycle-on .rankmem{bottom:244px;max-height:calc(100% - 254px)}
  .stage.mem-cycle-on .canvas-bottom-tools{bottom:198px}
  .stage.mem-cycle-on.mem-cycle-collapsed #cv{height:calc(100% - 52px)}
  .stage.mem-cycle-on.mem-cycle-collapsed .rankmem{bottom:106px;max-height:calc(100% - 116px)}
  .stage.mem-cycle-on.mem-cycle-collapsed .canvas-bottom-tools{bottom:60px}
  /* 详情固定在屏幕右侧；打开后周期面板收窄到它左边，两者保持并列而不覆盖。 */
  .page.mem-detail-open .stage.mem-cycle-on .mem-cycle{right:390px}

  /* 舞台：一块 canvas，十步全在上面变形 */
  .stage{grid-area:stage;position:relative;padding:12px 36px 12px 12px;min-width:0;min-height:0}
  @media (min-width:861px){
    .stage.mem-cycle-on,.page[data-side="off"] .stage.mem-cycle-on{padding-left:24px;padding-right:24px}
  }
  .stage .box{position:relative;width:100%;height:100%;overflow:hidden}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* 画布工具照组合工作台里的 parallel-topology-v2：stagebar 放在页头原 pattern 入口的位置，
     左下 zoomhud 管缩放 / 居中 / 复位。这里保留同一组 pt-* 类名，业务项换成 rank 入门画布自己的能力。 */
  .pt-stagebar{position:relative;z-index:31;display:flex;gap:6px;align-items:center;justify-content:flex-end}
  .page[data-tab="scene"] .pt-stagebar{display:none}
  .pt-cfg{position:relative;display:inline-flex}
  .pt-cfgbtn{height:28px;padding:0 10px;border-radius:6px;display:inline-flex;gap:6px;align-items:center;justify-content:center;
             border:1px solid var(--line);background:var(--bg);color:var(--fg2);cursor:pointer;font:600 12px/1 var(--sans)}
  .pt-cfgbtn:hover{background:var(--bg2);border-color:rgba(var(--fgrgb),.28);color:var(--fg)}
  .pt-cfgbtn.is-on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  /* 第 10 步删除内容区 cs-head 后，播放入口提升到顶栏，位置与第 9 步“视图”按钮一致。 */
  .top-play{display:none}
  .page[data-tab="intro"].intro-config-step .intro-config-play{display:inline-flex}
  .rank-cycle-play:not([hidden]){display:inline-flex}
  .top-play svg{width:13px;height:13px;fill:currentColor}
  .top-play .ic-pause,.top-play .state-pause{display:none}
  .top-play[aria-pressed="true"] .ic-play,.top-play[aria-pressed="true"] .state-play{display:none}
  .top-play[aria-pressed="true"] .ic-pause,.top-play[aria-pressed="true"] .state-pause{display:block}
  .pt-cfgpanel{display:none}
  .pt-cfgpanel.is-open{display:block;position:absolute;top:36px;right:0;z-index:22;width:min(322.5px,calc(100vw - 48px));
                      max-height:calc(100vh - 80px);overflow:auto;scrollbar-gutter:stable;background:var(--bg);
                      border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 12px 34px rgba(var(--fgrgb),.16)}
  html[data-theme="dark"] .pt-cfgpanel.is-open{box-shadow:0 12px 34px rgba(0,0,0,.48)}
  .pt-cfgpanel .cg{padding:12px 0;border-top:0;display:flex;flex-wrap:wrap;gap:8px}
  .pt-cfgpanel .cg:first-child{border-top:0;padding-top:0}
  .pt-cfgpanel .cg:last-child{padding-bottom:0}
  .pt-cfgpanel .cg>h6,.pt-cfgpanel .cg>.cgrow,.pt-cfgpanel .cg>.pt-find,.pt-cfgpanel .cg>.cnote,.pt-cfgpanel .cg>.acts{flex:1 1 100%}
  .pt-cfgpanel h6{margin:0;font:600 12px/1.2 var(--sans);letter-spacing:.04em;color:var(--fg3)}
  .pt-cfgpanel .cgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pt-seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg2)}
  .pt-seg button,.pb{height:28px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--fg2);
                     font:600 12px/1 var(--sans);cursor:pointer}
  .pt-seg button:hover,.pb:hover{color:var(--fg);background:rgba(var(--fgrgb),.06)}
  .pt-seg button.is-on,.pb.is-on{background:var(--fg);color:var(--bg)}
  .pt-seg button:disabled{opacity:.36;cursor:not-allowed}
  .pb{border:1px solid var(--line);background:var(--bg)}
  .pb.mono{font-family:var(--mono)}
  .dim-prefix .pb.is-on{background:var(--c,var(--fg));border-color:var(--c,var(--fg));color:#fff}
  .pt-find{display:flex;gap:7px;align-items:center}
  .pt-find input{width:88px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg2);
                   color:var(--fg);font:500 12px var(--mono)}
  .pt-find input:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(67,105,239,.22);border-color:var(--dp)}
  .pt-cfgpanel .cnote{font-size:11.5px;line-height:1.5;color:var(--fg3)}
  .pt-cfgpanel button.mvi{display:flex;flex:1 1 calc(50% - 4px);min-height:30px;align-items:center;gap:8px;text-align:left;
                          border:0;background:none;padding:0 8px;border-radius:7px;color:var(--fg);font:500 12px var(--sans);cursor:pointer}
  .pt-cfgpanel button.mvi:hover{background:var(--bg2)}
  .pt-cfgpanel button.mvi s{flex:none;width:15px;height:15px;border-radius:4px;border:1px solid var(--line);text-decoration:none;
                            color:transparent;font-size:11px;line-height:13px;text-align:center}
  .pt-cfgpanel button.mvi.is-on s{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .pt-cfgpanel button.mvi em{margin-left:auto;font:400 10.5px var(--mono);color:var(--fg3)}
  .pt-cfgpanel button.mvi:disabled{opacity:.38;cursor:not-allowed}
  .pt-cfgpanel .acts{display:flex;gap:8px}
  .pt-cfgpanel .acts button{flex:1;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg2);font:500 12px var(--sans);cursor:pointer}
  .pt-cfgpanel .acts button:hover{background:var(--bg2);color:var(--fg)}
  .pt-zoomhud{position:relative;display:flex;align-items:center;gap:4px;padding:4px;
              border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);
              backdrop-filter:blur(6px);box-shadow:0 1px 4px rgba(var(--fgrgb),.06)}
  .pt-zoomhud[hidden]{display:none}
  .pt-zoomhud button{min-width:26px;height:26px;padding:0 8px;border:0;border-radius:999px;background:transparent;
                     color:var(--fg2);font:700 13px/1 var(--sans);cursor:pointer}
  .pt-zoomhud button:hover{background:var(--bg2);color:var(--fg)}
  .pt-zoomhud button[aria-checked="true"]{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
  .pt-zoomhud .zpct{min-width:52px;text-align:center;color:var(--fg);font:700 12px/1 var(--mono)}
  .pt-zoomhud .zsep{width:1px;height:16px;background:var(--line);margin:0 2px}
  .pt-zoomhud .zicon{width:26px;min-width:26px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  .pt-zoomhud .zicon svg{width:16px;height:16px;display:block;pointer-events:none}
  /* 第 10 步配置预览使用自己的紧凑 pzoom；主画布使用上面的 pt-zoomhud。 */
  .pzoom{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:2px;padding:3px;
         background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 4px rgba(var(--fgrgb),.06)}
  .pzoom[hidden]{display:none}
  /* 第 10 步内存热力图例：独立悬在画布工具条上方并与其右边缘对齐。
     单点与范围共用同一种白色竖线；范围只在两端各落一根线，不再另画矩形。 */
  .c4-memory-legend{position:absolute;right:10px;bottom:54px;z-index:10;box-sizing:border-box;width:min(340px,calc(100% - 20px));padding:8px 10px 7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.16);pointer-events:none}
  .c4-memory-legend[hidden],.c4-memory-legend [hidden]{display:none}
  .c4-memory-legend__caption{color:var(--fg3);font:600 10px/1.2 var(--sans)}
  .c4-memory-legend__scale{display:grid;grid-template-columns:30px minmax(180px,1fr) 36px;align-items:center;gap:6px;padding-block:18px 16px;color:var(--fg3);font:500 10px/1 var(--mono)}
  .c4-memory-legend__scale>.end:first-child{text-align:right}.c4-memory-legend__scale>.end:last-child{text-align:left}
  .c4-memory-legend__track{--memory-min:0%;--memory-max:100%;position:relative;display:block;min-width:0;height:10px}
  .c4-memory-legend__ramp{position:absolute;inset:0;display:block;overflow:hidden;border-radius:999px;background-repeat:no-repeat;background-size:100% 100%;background-clip:padding-box;clip-path:inset(0 round 999px)}
  .c4-memory-legend__shade{position:absolute;top:1px;bottom:1px;z-index:1;background:color-mix(in srgb,var(--bg) 68%,transparent)}
  .c4-memory-legend__shade--lo{left:1px;width:var(--memory-min)}.c4-memory-legend__shade--hi{left:var(--memory-max);right:1px}
  .c4-memory-legend__marker{position:absolute;top:50%;z-index:3;width:0;height:0}
  .c4-memory-legend__marker::before{content:"";position:absolute;left:-1px;top:-8px;width:2px;height:16px;border-radius:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.42),0 0 5px rgba(255,255,255,.5)}
  .c4-memory-legend__marker-label{position:absolute;left:0;transform:translateX(-50%);color:var(--fg);font:600 10px/1 var(--mono);white-space:nowrap}
  .c4-memory-legend__marker[data-edge="start"] .c4-memory-legend__marker-label{transform:translateX(0)}
  .c4-memory-legend__marker[data-edge="end"] .c4-memory-legend__marker-label{transform:translateX(-100%)}
  .c4-memory-legend__marker--min .c4-memory-legend__marker-label{top:11px}
  .c4-memory-legend__marker--max .c4-memory-legend__marker-label,.c4-memory-legend__marker--rank .c4-memory-legend__marker-label{bottom:11px}
  .c4-memory-legend.is-single .c4-memory-legend__ramp{filter:saturate(.82) brightness(.82)}
  /* ── 右栏「Layer x · 各域计算耗时差异」（sideP.panel 的内容）──────────────────
     结论复用左栏「配置建议」横幅；每个同步域只保留两张等高指标卡。
     每个 --dom-c 由行内 style 下发，用的是第 9 步那套域色（TP 青 / EP 紫 / DP 蓝 / EDP 粉）。 */
  .c4dm-advice{margin:0 0 10px}
  .c4dm-advice .cro-config-error__msg{font-family:var(--sans)}
  .c4dm-advice .cro-config-error__actions button{font:600 12px/1.2 var(--sans)}
  .c4dm-top{margin:0 0 10px;font:400 10.5px/1.5 var(--sans);color:var(--fg3)}
  .c4dm-top b{font-family:var(--mono);color:var(--fg2);font-weight:600}
  .c4dm-lead{margin:0 0 9px;padding:6px 8px;border-left:2px solid var(--dom-c);border-radius:0 4px 4px 0;
             background:rgba(var(--fgrgb),.05);font:400 10.5px/1.45 var(--sans);color:var(--fg2)}
  .c4dm-lead b{font-weight:600;color:var(--fg)}
  .c4dm-blk{margin:0 0 10px;font-family:var(--sans)}
  .c4dm-blk h4{display:flex;align-items:baseline;gap:5px;margin:0 0 3px;font:600 11px/1.3 var(--sans);color:var(--dom-c)}
  .c4dm-blk h4 em{width:6px;height:6px;border-radius:2px;background:currentColor;flex:none}
  .c4dm-blk h4 span{margin-left:auto;font:400 9.5px/1.3 var(--mono);color:var(--fg3)}
  .c4dm-blk.is-off h4{opacity:.5}
  .c4dm-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:104px;gap:6px}
  /* 一张卡 = 一个可点的组：点它，矩阵就标出这一组的成员卡。两张卡固定等高，数值固定落在左下角。 */
  .c4dm-card{position:relative;min-width:0;height:104px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:3px;
             padding:8px;border:0;border-radius:var(--radius-md);background:var(--bg2);color:var(--fg2);cursor:default;font:400 10px/1.35 var(--sans)}
  .c4dm-card .hd{display:block}
  .c4dm-card .k{font-size:10px;color:var(--fg3)}
  .c4dm-card .g{font:600 10px/1.35 var(--mono);color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c4dm-card .v{position:absolute;left:8px;bottom:8px;font:700 24px/1 var(--mono);letter-spacing:-.02em;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
  button.c4dm-card{cursor:pointer}
  button.c4dm-card:not(:disabled):hover{background:color-mix(in srgb,var(--dom-c) 9%,var(--bg2))}
  button.c4dm-card:not(:disabled):focus-visible{outline:2px solid var(--dom-c);outline-offset:1px}
  button.c4dm-card:disabled{cursor:default;opacity:.42;filter:grayscale(1)}
  .c4dm-card.is-bad .v{color:var(--bad)}
  .c4dm-card.is-on{background:color-mix(in srgb,var(--dom-c) 16%,var(--bg2));outline:1px solid color-mix(in srgb,var(--dom-c) 58%,transparent)}
  .c4dm-off{margin:0;padding:7px 8px;border-radius:var(--radius-md);background:var(--bg2);font:400 10px/1.4 var(--sans);color:var(--fg3)}
  .c4dm-hint{margin:6px 0 0;font:400 9.5px/1.4 var(--sans);color:var(--fg3)}
  .pzoom button{font:inherit;font-size:12px;line-height:1;color:var(--fg2);background:none;border:0;border-radius:4px;padding:5px 8px;cursor:pointer}
  .pzoom button:hover{background:rgba(var(--fgrgb),.06);color:var(--fg)}
  .pzoom .rd{font-family:var(--mono);font-size:11px;color:var(--fg3);min-width:40px;text-align:center}
  /* ETP 是低频高级项：折叠在通信详情最底部，不覆盖 Canvas，也不抢阶段与通信卡的主层级。 */
  .ctog{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:0;border-radius:var(--radius-md);background:var(--bg2);
        font:500 11px/1.4 var(--sans);color:var(--fg2);cursor:pointer;user-select:none;text-align:left}
  .ctog[hidden]{display:none}
  .ctog:hover{color:var(--fg);background:var(--state-hover)}
  .ctog:focus-visible{outline:none;box-shadow:0 0 0 3px var(--state-focus)}
  .ctog .ctog-label{min-width:0}
  .ctog .ctog-label b{display:block;color:var(--fg);font-weight:650}
  .ctog .ctog-label small{display:block;margin-top:2px;color:var(--fg3);font:400 10px/1.35 var(--sans)}
  .ctog .sw{position:relative;flex:none;width:30px;height:16px;border-radius:8px;background:rgba(var(--fgrgb),.22);transition:background 140ms ease}
  .ctog .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left 140ms ease}
  .ctog[aria-checked="true"]{color:var(--fg)}
  .ctog[aria-checked="true"] .sw{background:var(--tp)}
  .ctog[aria-checked="true"] .sw::after{left:16px}
  .comm-etp-fold{margin-top:4px;padding-top:10px;border-top:1px solid var(--line);color:var(--fg3)}
  .comm-etp-fold summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font:550 10px/1.4 var(--sans);user-select:none}
  .comm-etp-fold summary::-webkit-details-marker{display:none}
  .comm-etp-fold summary::before{content:'›';font:700 13px/1 var(--mono);transform:rotate(0deg);transition:transform 120ms ease}
  .comm-etp-fold[open] summary::before{transform:rotate(90deg)}
  .comm-etp-fold #commEtpHost{margin-top:7px}
  .comm-etp-fold .ctog{padding:7px 8px;background:transparent;border:1px solid var(--line);opacity:.82}
  .foot{grid-area:foot;padding:8px 36px 26px 36px;display:flex;align-items:flex-end;gap:28px}
  .nav{display:flex;gap:8px;flex:none}
  .nav button{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
  .nav button:hover{border-color:rgba(var(--fgrgb),.3)}
  .nav button:disabled{color:var(--fg3);cursor:default;border-color:var(--line)}
  .steps{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;min-width:0}
  .steps button{font:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;color:var(--fg3)}
  .steps .lbl{display:block;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  .steps .bar{display:block;height:3px;background:rgba(var(--fgrgb),.08);border-radius:2px}
  .steps button:hover .lbl{color:var(--fg2)}
  .steps button.done .bar{background:rgba(var(--fgrgb),.28)}

<script>
(function(){
  /* 共享规则层（../shared/plane-rules.js，与 config-relation-plane 同一份）：
     口径换算、约束谓词、专家四色、热力色阶、量尺梯子、字段量程全从它读 */
  var PR = window.PTOPlaneRules;
  var ACT_HEAT_LIGHT = [[0,226,232,244],[.22,166,186,230],[.44,160,130,210],[.64,196,88,158],[.82,226,68,84],[1,255,124,46]];
  function activationHeatColor(u){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return PR.heatColor(u,dark ? PR.HEAT_RAMP : ACT_HEAT_LIGHT);
  }
  var VC = {tp:'#22D3EE', pp:'#FFAA3B', dp:'#4369EF', ep:'#9B3CF6', edp:'#E04FA8'};   /* edp：专家参数的副本组，只在第 9 步的连线里用 */
  /* 画布用的中性色全从 CSS token 读，切主题时重读一遍再重画 */
  var TH = {};
  /* 显存五档的基准色相照 demo 的 MEM_BASE；最终填色照 demo 的 syncTopologyPalette 按主题调：
     浅色原样用，深色保留色相、统一压到 S .82 / L .40（近中性的那档退成 L .48 的灰），
     这样第 8 / 9 步卡里的填充跟原组件深色下是同一套颜色 */
  /* 优化器态沿用原版的柔和紫色；显存档位与并行维度靠位置和语义区分。 */
  var MEM_BASE = {w:'#5C86C7', g:'#6F9BA6', opt:'#9F93D1', act:'#78A866', rsv:'#C8CACB'};
  var MEM_PROFILE = {dark:{s:.82, l:.40, neutralL:.48}, light:{preserve:true}};
  var MEMC = {};
  function hexToHsl(hex){
    var n = parseInt(hex.slice(1), 16), r = (n>>16)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
    var max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min, h = 0, l = (max + min)/2, sat = d ? d/(1 - Math.abs(2*l - 1)) : 0;
    if(d){ if(max === r) h = ((g - b)/d)%6; else if(max === g) h = (b - r)/d + 2; else h = (r - g)/d + 4; h = ((h*60)%360 + 360)%360; }
    return {h:h, s:sat, l:l};
  }
  function hslToHex(h, sat, l){
    var c = (1 - Math.abs(2*l - 1))*sat, x = c*(1 - Math.abs((h/60)%2 - 1)), m = l - c/2;
    var q = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
    return '#' + q.map(function(v){ return Math.round((v + m)*255).toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }
  function syncMemPalette(){
    var prof = MEM_PROFILE[document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'];
    Object.keys(MEM_BASE).forEach(function(k){
      if(prof.preserve){ MEMC[k] = MEM_BASE[k]; return; }
      var hsl = hexToHsl(MEM_BASE[k]), neutral = hsl.s < .08;
      MEMC[k] = hslToHex(hsl.h, neutral ? 0 : prof.s, neutral ? prof.neutralL : prof.l);
    });
    /* 卡上的显存账是建卡时抄走的颜色，切主题后按档位补回来 */
    if(typeof cards !== 'undefined' && cards) cards.forEach(function(c){ if(c.mem) c.mem.forEach(function(m){ m.c = MEMC[m.k]; }); });
  }
  function readTheme(){
    var cs = getComputedStyle(document.documentElement), g = function(n){ return cs.getPropertyValue(n).trim(); };
    TH.bg = g('--bg'); TH.fg = g('--fg'); TH.fg2 = g('--fg2'); TH.fg3 = g('--fg3'); TH.rgb = g('--fgrgb'); TH.bad = g('--bad');
    TH.face = {front:g('--card-front'), right:g('--card-right'), top:g('--card-top')}; TH.tile = g('--tile');
    syncMemPalette();
  }
  readTheme();
  /* ── 显存账：口径照 demo 的 opBytes / paramsPerCard / memParts / rankLoad 搬过来 ──
     配置就是 default128：tp2·cp1·pp4·dp16·ep8·etp1，48 层，hidden 4096，32 头 / 8 kv 头，
     ffn 2048，vocab 128256，seq 8192，64 专家，mbs 1，ga 8，HBM 64 GB，ZeRO 关。
     五档颜色照 MEM_BASE（见上面 syncMemPalette，随主题调）。路由不均 / 缓存预留两项和 demo 一样是 sin-hash 的确定性合成。 */
  var CFG = {tp:2, cp:1, pp:4, dp:16, ep:8, etp:1, layers:48, hidden:4096, heads:32, kv:8, ffn:2048,
             vocab:128256, seq:8192, experts:64, mbs:1, ga:8, hbm:64};
  var GiB = Math.pow(2, 30), LPS = CFG.layers/CFG.pp, HD = CFG.hidden/CFG.heads;
  function opBytes(){
    var D = CFG;
    return [
      {id:'attn.q',  cut:'tp', how:'列切 ×'+D.tp, b:2*D.hidden*(D.heads/D.tp)*HD},
      {id:'attn.kv', cut:'tp', how:'头切 ×'+D.tp, b:2*D.hidden*2*(D.kv/D.tp)*HD},
      {id:'attn.out',cut:'tp', how:'行切 ×'+D.tp, b:2*(D.heads/D.tp)*HD*D.hidden},
      {id:'router',  cut:'none', how:'复制', b:2*D.hidden*D.experts},
      {id:'experts', cut:'ep', how:'桶切 ×'+D.ep+'·ETP'+D.etp, b:2*(D.experts/D.ep)*3*D.hidden*(D.ffn/D.etp)},
      {id:'norm×2',  cut:'none', how:'复制', b:2*2*D.hidden}
    ];
  }
  function loadSeed(k, salt){ var r = Math.sin((k+1)*45.233 + (salt+1)*97.117) * 28657.13; return r - Math.floor(r); }
  function memOf(c, scenario){
    var D = CFG, p = c.pp, ep = c.dp % D.ep;
    var key = (((c.tp*7 + 0)*13 + c.dp)*17 + p) + ep*211;
    var actK = (0.74 + loadSeed(ep, 3)*0.62) * (0.95 + loadSeed(key, 11)*0.10);
    var rsv = (1.1 + loadSeed(key, 29)*1.6) * GiB;
    var vOwn = Math.ceil(D.vocab/D.tp);
    var sub = [];
    opBytes().forEach(function(x){ sub.push({id:x.id, cut:x.cut, how:x.how, bytes:x.b*LPS}); });
    if(p === 0)      sub.push({id:'embed',   cut:'tp', how:'词表列切 ×'+D.tp, bytes:2*vOwn*D.hidden});
    if(p === D.pp-1) sub.push({id:'lm_head', cut:'tp', how:'词表列切 ×'+D.tp, bytes:2*D.hidden*vOwn});

  /* ── SVG 小图（照 demo 的 proj / boxSVG / cavityGrid / compStrip / cavityBox3D / memChainFig）── */

  /* 点行：块本体加它左边的行标道都算这一行 */

  /* ② 两段块：Attention / MoE 两条横带（端点列一条），inset 1px、缝 1px */

    var FG = TH.rgb, ix = x + 1, iy = y + 1, iw = w - 2, ih = (h - 3)/2;

  /* ③ 计算图：面板按设计像素排好，整体 × s 缩进格子并居中 */

  /* 内存观测沿用第 8 步正视卡片的读法：以物理 HBM 为整格容量，五类占用自底向上

  /* f 是压平进度（已缓动）：格子从各自那只 3D 卡的顶面飞到自己那一行；底板、行标、

    /* ── 框线（照原画布）：两条尺各自是一只完整的框，四边都描；两层之间再各一条**连续**的分界
       （顶尺 PP|Layer 横线、左尺 EDP|DP 竖线）——不能只靠每格刻度描边，stage 缝隙与平移后露出的
       空段会断线。角的右边、下边正好是两只框的左边、上边，不用另描 ── */

    ctx.beginPath();
    ctx.rect(v.x0 + 0.5, 0.5, W - v.x0 - 1, v.y0 - 1);
    ctx.rect(0.5, v.y0 + 0.5, v.x0 - 1, H - v.y0 - 1);
    ctx.moveTo(v.x0, PL.RULER_PP_H - 0.5); ctx.lineTo(W, PL.RULER_PP_H - 0.5);
    ctx.moveTo(PL.RULER_EDP_W - 0.5, v.y0); ctx.lineTo(PL.RULER_EDP_W - 0.5, H);

  var rankLabelFaces=null;
  function frontRankLabelFaces(order){
    if(viewPose!=='front'&&viewPose!=='side')return null;
    var nearest={},visible={};
    order.forEach(function(c){
      if(c.a<=.01)return;
      var key=viewPose==='front'?(c.x.toFixed(4)+':'+c.y.toFixed(4)):(c.z.toFixed(4)+':'+c.y.toFixed(4));
      nearest[key]=c.r; /* 画家序为远 → 近，后写入的就是最靠镜头一面。 */
    });
    Object.keys(nearest).forEach(function(key){ visible[nearest[key]]=true; });
    return visible;
  }
  function draw(t){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var order = cards.slice().sort(cardPaintOrder);
    rankLabelFaces=frontRankLabelFaces(order);
    order.forEach(function(c){ drawCard(c, t); });
    rankLabelFaces=null;
    if(markOn.label) Object.keys(labs).forEach(function(kk){ var L = labs[kk]; if(L.a > 0.01) drawChip(L, L.a); });
    if(comm) drawComm(t);
    if(flatF > 0) drawPlane(t, flatF);
  }

  /* ── 步进 ────────────────────────────────────────────────────────── */
  var side = document.getElementById('side');
  var themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('ri-theme', t); }catch(e){}
    readTheme();
    /* 「node 0」那块门牌的颜色是排布时从 TH 抄走的，切主题后补一刀 */
    [labs.node, lay && lay.labels.filter(function(l){ return l.key === 'node'; })[0]].forEach(function(l){ if(l) l.c = TH.fg2; });
    renderRankMem();   /* 读出卡里的色块也跟着显存色板换 */
    if(window.RIMemoryCycle) window.RIMemoryCycle.redraw();
    needDraw = true; tick();
  });

  var stepsEl = document.getElementById('steps');
  STEPS.forEach(function(s, i){
    var b = document.createElement('button');
    b.style.setProperty('--c', s.color);
    b.innerHTML = '<span class="lbl">' + (i+1) + ' · ' + s.key + '</span><span class="bar"></span>';
    b.addEventListener('click', function(){ go(i); });
    stepsEl.appendChild(b);
  });

  function go(i){
    i = Math.max(0, Math.min(STEPS.length - 1, i));
    if(i === step) return;
    var previousStep = step;
    step = i;
    var s = STEPS[i];
    document.querySelector('.page').classList.toggle('intro-config-step', i === 9);
    if(window.RIConfigPreview){ if(i === 9 && document.querySelector('.page').dataset.tab !== 'scene') window.RIConfigPreview.enter(); else window.RIConfigPreview.leave(); }
    side.classList.add('switching');
    setTimeout(function(){
      document.getElementById('no').textContent = 'STEP ' + (i+1) + ' / ' + STEPS.length;
      document.getElementById('title').textContent = s.title;
      document.getElementById('body').innerHTML = s.html;
      side.classList.remove('switching');
    }, 200);

    applyStep(i, previousStep);

    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === STEPS.length - 1;
    Array.prototype.forEach.call(stepsEl.children, function(b, k){ b.classList.toggle('cur', k === i); b.classList.toggle('done', k < i); });
    try{ var q = new URLSearchParams(location.search); q.set('step', String(i+1)); history.replaceState(null, '', location.pathname + '?' + q.toString()); }catch(e){}
  }

  document.getElementById('prev').addEventListener('click', function(){ go(step - 1); });
  document.getElementById('next').addEventListener('click', function(){ go(step + 1); });
  document.addEventListener('keydown', function(e){
    if(e.target && /INPUT|TEXTAREA|BUTTON|SELECT/.test(e.target.tagName)) return;
    if(pageEl.dataset.tab === 'scene') return;

    else if(e.key === '-' || e.key === '_'){ zoomBy(1/1.25); e.preventDefault(); }
    else if(e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' '){ go(step + 1); e.preventDefault(); }
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ go(step - 1); e.preventDefault(); }

  var pageEl = document.querySelector('.page'), tabsEl = document.getElementById('tabs');

    pageEl.dataset.tab = id;

    if(id === 'intro') applySide(false, false);
    if(window.RIMemoryCycle){
      window.RIMemoryCycle.setVisible(id === 'intro' && (step === 7 || step === 8));
      if(id === 'intro' && step === 7 && memRankFocused && !rankFocus) window.RIMemoryCycle.startFromWarmup();
      else if(id === 'intro' && step === 8){
        if(commRankFocus) window.RIMemoryCycle.prepareWarmup();
        else window.RIMemoryCycle.startFromWarmup();
      }
    }
    if(id === 'intro' && (step === 7 || step === 8)) renderRankMem();
    Array.prototype.forEach.call(tabsEl.children, function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === id)); });
    try{ var q = new URLSearchParams(location.search); if(id === 'intro') q.delete('tab'); else q.set('tab', id);
         var qs = q.toString(); history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); }catch(e){}

  }

  /* 侧栏开关：实战页沿用用户记录；每次进入 Rank 的设计表达时默认收起。 */
  var sideBtn = document.getElementById('sideTg'), sideOn = true;
  try{ sideOn = localStorage.getItem('ri-side') !== 'off'; }catch(e){}
  function applySide(on, persist){
    sideOn = !!on;

    sideBtn.setAttribute('aria-pressed', String(sideOn));
    if(persist){ try{ localStorage.setItem('ri-side', sideOn ? 'on' : 'off'); }catch(e){} }

  }
  sideBtn.addEventListener('click', function(){ applySide(!sideOn, true); });
  applySide(sideOn, false);

  var footBtn = document.getElementById('footTg'), footOn = true;
  try{ footOn = localStorage.getItem('ri-foot') !== 'off'; }catch(e){}
  function applyFoot(on, persist){
    footOn = !!on;
    if(footOn) delete pageEl.dataset.foot; else pageEl.dataset.foot = 'off';
    footBtn.setAttribute('aria-pressed', String(footOn));
    if(persist){ try{ localStorage.setItem('ri-foot', footOn ? 'on' : 'off'); }catch(e){} }
    window.dispatchEvent(new Event('resize'));
  }
  footBtn.addEventListener('click', function(){ applyFoot(!footOn, true); });
  applyFoot(footOn, false);

  resize();
  var q0 = new URLSearchParams(location.search), st = parseInt(q0.get('step'), 10);
  go(isFinite(st) && st >= 1 ? st - 1 : 0);
  setTab(q0.get('tab'));

  /* 内存周期和配置预览共享的运行时接口。TH / MEMC 是同一个对象，切主题后自动是新的。 */
  window.RI = {cards:cards, layoutOf:layoutOf, U:U3D, TH:TH, MEMC:MEMC, VC:VC, CFG:CFG, GiB:GiB, shade:shade, hexA:hexA, dims:{CW:CW, CH:CH, CD:CD}, OCC:OCC, BG_FACE:BG_FACE,
    selectMemoryRank:function(r){
      if(step !== 7 || !isFinite(r) || !cards[r]) return;
      selRank = +r; memRankFocused = true; memSel = null; memSelR = null;
      syncStagebar(); renderRankMem(); needDraw = true; tick();
    },
    setMemoryCycleFrame:function(memByRank, cycleState, diagnosticState){
      cycleMem = memByRank;
      if(step === 8) commCycleState = cycleState;
      memoryDiagnosticState = diagnosticState || null;
      oomRankSet = {};
      if(memScenario === 'danger') memByRank.forEach(function(parts,r){
        if(parts.reduce(function(sum,m){ return sum + m.bytes; },0) > CFG.hbm*GiB) oomRankSet[r] = true;
      });

    }};

  /* 留给案例四：第 10 步那块展平画布整套借出去画到它自己的 canvas 上。
     画法全是本页闭包里的 drawPlane / drawRulers / planeHit…，它们读的是闭包里的 ctx / W / H / view /
     selRank / selLayer / TOPO / PC 这些变量——借的办法不是复制一份函数，而是**临时把这些变量换成
     借方的**（env），跑完再换回来。env 是借方自己保管的一个对象：
       {ctx, W, H, DPR, tag, PC, TOPO, plane, view:{x,y,k}, selRank, selLayer, layerGuide, hoverLayer, tpOn, paintOn, hiCols}

    ctx = env.ctx; W = env.W; H = env.H; DPR = env.DPR; ctxTag = env.tag || 1; PC = env.PC; TOPO = env.TOPO; plane = env.plane; view = env.view;
    selRank = env.selRank; selLayer = env.selLayer; layerGuide = env.layerGuide; hoverLayer = env.hoverLayer || null; tpOn = env.tpOn; paintOn = env.paintOn; hiCols = env.hiCols || null; chipPaint = !!env.chipPaint;
    cellHeat = typeof env.cellHeat === 'function' ? env.cellHeat : null; layerVisible = env.layerVisible !== false;

    try{ return fn(); }
    finally{
      ctx = o.ctx; W = o.W; H = o.H; DPR = o.DPR; ctxTag = o.tag; PC = o.PC; TOPO = o.TOPO; plane = o.plane; view = o.view;
      selRank = o.selRank; selLayer = o.selLayer; layerGuide = o.layerGuide; hoverLayer = o.hoverLayer; tpOn = o.tpOn; paintOn = o.paintOn; hiCols = o.hiCols; chipPaint = o.chipPaint; cellHeat = o.cellHeat; layerVisible = o.layerVisible;
      memoryMode = o.memoryMode; memoryByRank = o.memoryByRank; memoryCapacity = o.memoryCapacity;
    }
  }
  /* 一格 / 一行在屏幕上的矩形（借方画自己的叠加层要用：超容格填色、缩放动画要对准的那一格） */
  function cellRectOf(r, key){
    var c = PC[r], b = plane.blocks[c.pp], k = view.k, y = view.y + plane.rowY(c.k)*k;
    if(key == null) return {x:view.x + b.x*k, y:y, w:b.w*k, h:plane.cellH*k};
    for(var ci = 0; ci < b.cols.length; ci++) if(colKey(b.cols[ci]) === key) return {x:view.x + (b.x + ci*plane.cellW)*k, y:y, w:plane.cellW*k, h:plane.cellH*k};
    return null;
  }
  window.RI.plane = {
    PL:PL, DP:DP, SETC:SETC, BLUE:BLUE, topoOf:topoOf, colKey:colKey, memWith:memWith,
    build:function(env){ return planeEnv(env, function(){ plane = buildPlane(); env.plane = plane; return plane; }); },
    fit:function(env){ planeEnv(env, fitPlaneRaw); },
    draw:function(env){ planeEnv(env, function(){ drawPlane(now(), 1); }); },
    hit:function(env, mx, my){ return planeEnv(env, function(){ return planeHit(mx, my); }); },
    tick:function(env, mx, my){ return planeEnv(env, function(){ return planeTickAt(mx, my); }); },
    colAt:function(env, mx){ return planeEnv(env, function(){ return planeColAt(mx); }); },
    zoom:function(env, mx, my, nk){ return planeEnv(env, function(){ return zoomAtRaw(mx, my, nk); }); },
    pan:function(env){ planeEnv(env, clampPan); },
    sync:function(env, k){ planeEnv(env, function(){ syncGeom(k); }); },
    cellRect:function(env, r, key){ return planeEnv(env, function(){ return cellRectOf(r, key); }); },
    /* 放大到几倍才进「计算图」那一档（第 10 步三档里的第三档）——缩放动画的终点 */
    detailK:function(env){ return planeEnv(env, function(){ return PL.DETAIL_MIN_S/Math.min((plane.cellW - 2)/DP.W, (plane.cellH - 2)/plane.panels.moe.h); }); },
    /* 整网图要在自己的画布上把一层的计算图放大画：面板图元 + 画法都借这里的 */
    spec:function(env, col){ return planeEnv(env, function(){ return panelSpec(col); }); },
    detail:function(env, cx, cy, spec, s, col, c){ planeEnv(env, function(){ drawDetail(cx, cy, spec, s, col, c); }); }
  };
})();

<script>
/* ── 实战场景：一个案例一张图，一段一行字 ──────────────────────────────
   案例一的原型：openPangu-2.0-Flash，2048 NPU，EP64 / TP1 / PP4 / DP8，FP8，step 15203
   被 NCCL timeout 打断（出处：定位链-openPangu-2.0-Flash.md「问题影响 2」）。四段传播的
   数量级一律照真实现场那套 1 → 64 → 256 → 2048 来写；图是拿本页那套 128 rank
   （tp2·pp4·dp16·ep8，48 层）缩小一号画的替身——每一跳撞的还是同三道边界
   （EP 组 → 模型副本 → DP 全局）。四段各一档红，分四批亮起。

   案例二是 infra 视角：同一幅展平图不再填「传播到哪」，而是当热力图填一个度量 ——
   取 config-relation-plane「负载热力」六个度量里的**计算时间**（这张卡在这一层上算一个
   micro-batch 用了多少 ms）。选它是因为它对应的故障形状是 infra 最高频要认的那一种：
   一台机器降频 / ECC 退化 / 风扇故障 → 算力打折 → 8 张卡 8 行整体抬起来，横带正好一台
   整机宽。四段是一根时间轴：日常分布（横向无结构）→ 苗头（降 6%，肉眼将将可辨）→
   横带显形（0.68 倍算力，config-relation-plane 里 FAULT.slowFactor 的取值）→ 换成互补的
   「空闲时间」看谁在为它买单。色阶照那页的 HEAT_RAMP（冷蓝 → 火红，中途绕开绿），
   浅色主题把冷端换成淡蓝灰，格子在白底上才不会一片墨。

   图的口径照第 10 步那张展平视图：横轴 48 层按 PP 段切 4 块（每块 12 层），纵轴 32 行 =
   一段里的 32 张卡（k = dp·2 + tp，两行一个 DP、8 行一台整机、16 行一个 EDP 副本），
   一格 = 一张卡的一层，整幅 4 × 32 = 128 张卡。差别只有两处：这里是 DOM 不是 canvas；
   两端的 Emb / Norm / Head 列省掉，只留 48 个 Transformer 层，让 4 块一样宽。
   格子尺寸由 fit() 按可用空间现算，图居中放到最大。 */
(function(){
  /* 共享规则层（../shared/plane-rules.js）：案例二的热力色阶、案例四的口径换算与
     约束谓词、字段量程都从它读 —— 与 config-relation-plane 同一份 */
  var PR = window.PTOPlaneRules;
  var railEl = document.getElementById('csRail'), mainEl = document.getElementById('csMain');
  if(!railEl || !mainEl) return;
  var pageEl = document.querySelector('.page'), tabsEl = document.getElementById('tabs');

  /* 自动剧本的浮动操作指针。target 可以是 DOM、选择器，或画布里的
     {element, localX, localY}；后者让指针真落在某一格 / 某个算子上，而不是笼统指向整张画布。 */
  var DemoPointer = (function(){
    var el = null, timers = [], reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    function later(fn, ms){ var id = setTimeout(fn, ms); timers.push(id); return id; }
    function clear(hide){ timers.forEach(clearTimeout); timers = [];

    }
    function hostOf(s){ return s && s.element && s.element.closest ? (s.element.closest('.cs-main') || mainEl) : mainEl; }
    function ensure(host){
      host = host || mainEl;
      if(!el){
        el = document.createElement('div'); el.className = 'cs-demo-pointer'; el.setAttribute('aria-hidden', 'true');
        el.innerHTML = '<svg viewBox="0 0 24 30"><path d="M2.5 1.8v20.4l5.2-4.6 3.9 9.1 4-1.8-4-8.8h7.1z"/></svg><i class="pulse"></i>';
      }
      /* 第 10 步住在 #introConfig，实战案例住在 #csMain；跟随目标换宿主，坐标才落在当前可见画布。 */
      if(el.parentNode !== host) host.appendChild(el);

    }
    function specOf(target){
      var t = typeof target === 'function' ? target() : target;
      if(typeof t === 'string') t = document.querySelector(t);

    }

      clear(false);
      var s = specOf(target); if(!s){ if(fn) fn(); return; }
      var wait = reveal(s), host = hostOf(s), p = ensure(host);
      later(function(){
        /* target 是函数时重取一次：滚动 / 重排之后，画布命中点的位置可能已经变了。 */
        s = specOf(target); var pt = pointOf(s); if(!pt){ if(fn) fn(); return; }
        host = hostOf(s); p = ensure(host);

        if(!p.classList.contains('on')){
          p.style.transition = 'none'; p.style.transform = 'translate3d(' + (x - 46) + 'px,' + (y + 34) + 'px,0)';
          p.classList.add('on'); void p.offsetWidth; p.style.transition = '';

        later(function(){
          p.classList.remove('click'); void p.offsetWidth; p.classList.add('down', 'click');
          later(function(){ if(fn) fn(); }, reduced ? 0 : 90);

    }
    return {click:click, stop:function(){ clear(true); }};
  })();

  /* cg 取 3：照第 10 步展平画布 PL.CELL_GAP 的格缝，两幅图的格子疏密一致 */
  var G = {cols:12, rows:32, cw:15, ch:12, cg:3, pad:3, bgap:12, lw:46, ruler:34, legend:30, vtabs:30};
  function egap(){ return Math.max(8, Math.round(G.ch*1.1)); }     /* 副本缝 */
  function ngap(){ return Math.max(4, Math.round(G.ch*0.5)); }     /* 整机缝 */
  function rowTop(k){

    return '<button type="button" class="rep" data-rep="1" title="播放 / 暂停" aria-label="播放 / 暂停">'
         + '<svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 3 14 9-14 9z"/></svg>'
         + '<svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>';
  }
  function stepsHTML(){
    var ST = steps();
    return repHTML() + ST.map(function(s, i){
      return '<button type="button" data-s="' + (i + 1) + '" style="--fc:' + s.c + '" class="'
           + (i + 1 <= stage ? 'done ' : '') + (i + 1 === stage ? 'cur' : '') + '">'
           + '<span class="lbl">' + s.lbl + '</span><span class="bar" role="progressbar" aria-label="步骤进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'
           + (i + 1 < stage ? '100' : '0') + '"></span></button>';
    }).join('');
  }
  /* 播放状态：'full' 全流程在播 / 'single' 手动单段播放 / 'idle' 停着；写在段控容器上，播放键的图标照它换 */
  var mode = 'idle', progressRaf = 0;
  var stepProgress = {stage:0, value:0, start:0, duration:0, playing:false};
  function stepDuration(s){
    var c = CASES[cur];
    return c.heat ? 2100 : 1700;
  }
  function paintStepProgress(now){
    progressRaf = 0;
    if(stepProgress.playing){
      stepProgress.value = Math.min(1, ((now || performance.now()) - stepProgress.start)/stepProgress.duration);
      if(stepProgress.value >= 1) stepProgress.playing = false;
    }
    var st = document.getElementById('csSteps');
    if(st && stepProgress.stage){
      var bar = st.querySelector('button[data-s="' + stepProgress.stage + '"] .bar');
      if(bar){
        var value = stepProgress.value || 0;
        bar.style.setProperty('--progress', value);
        bar.setAttribute('aria-valuenow', String(Math.round(value*100)));
      }
    }
    if(stepProgress.playing && active()) queueStepProgress();
  }
  function queueStepProgress(){ if(!progressRaf) progressRaf = requestAnimationFrame(paintStepProgress); }
  function beginStepProgress(s, duration){
    stepProgress = {stage:s, value:0, start:performance.now(), duration:duration || stepDuration(s), playing:true};
    queueStepProgress();
  }
  function finishStepProgress(){ stepProgress.value = 1; stepProgress.playing = false; queueStepProgress(); }
  function freezeStepProgress(){
    if(stepProgress.playing) stepProgress.value = Math.min(1, (performance.now() - stepProgress.start)/stepProgress.duration);
    stepProgress.playing = false;
  }
  function setStepProgress(s, value){
    stepProgress = {stage:s, value:value == null ? 1 : value, start:0, duration:0, playing:false};
  }
  function setMode(m){
    mode = m; var st = document.getElementById('csSteps'); if(st) st.dataset.play = m;
    queueStepProgress();
  }

  function render(){
    railEl.innerHTML = railHTML();
    var c = CASES[cur];
    var head = '<div class="cs-head"><h1>' + c.rail + '</h1><div class="cs-steps" id="csSteps"></div>'
      + '<p class="cs-cap" id="csCap"></p></div>'
    var fig = '<div class="cs-figwrap' + (c.heat ? ' heat' : '') + '" id="csFig"></div>';
    mainEl.innerHTML = head + fig;
    paint();
    if(active()) play();
  }
  /* 图重画（尺寸变了要重排），文字与段控只换内容 */
  function paint(){
    var fig = document.getElementById('csFig'), c = CASES[cur]; if(!fig) return;
    fit();
    if(c.heat){
      fig.innerHTML = '<div><div class="cs-vtabs" id="csVtabs" role="tablist" aria-label="热力度量">'
        + '<button type="button" role="tab" data-v="busy">按计算时间</button><button type="button" role="tab" data-v="idle">按空闲时间</button><span class="knob" aria-hidden="true"></span></div>'
        + planeHTML({cls:'heat', band:{stage:SLOW_S, k0:SLOW_K0, k1:SLOW_K1, label:''}})
        + '<div class="cs-legend" id="csLegend"></div></div>';
    }else{
      fig.innerHTML = planeHTML({cls:'s' + stage, cell:cell1, hotLayer:FL, hotDP:11, marks:MK1});
    }
    sync();
  }
  /* 热力案例：每一段重算 1536 格的底色（inline style），每一格自己从旧色渐到新色（不逐列错开，
     扫描是传播案例的语言，这里变的是读数）；色阶图例跟着这一段的度量换文字 */
  function fillHeat(){
    var p = document.getElementById('csPlane'), lg = document.getElementById('csLegend'), band = document.getElementById('csBand');
    if(!p) return;
    var cells = p.querySelectorAll('.cs-cell'), i = 0;
    for(var s = 0; s < 4; s++) for(var k = 0; k < G.rows; k++) for(var ci = 0; ci < G.cols; ci++)
      cells[i++].style.background = fill2(s*32 + k, s*12 + ci, stage);
    var m = stage ? ST2[stage - 1] : null;
    if(band){ band.classList.toggle('on', !!(m && m.band)); if(m && m.band) band.firstChild.textContent = m.band; }
    /* 集群图上方那两枚视图页签：播到第四段时它自己切到「空闲时间」，示意这是换了个视图 */
    var vt = document.getElementById('csVtabs');
    if(vt){
      vt.classList.toggle('idle', !!m && m.view === 'idle');
      vt.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-selected', String(!!m && b.dataset.v === m.view)); });
    }
    if(lg){
      lg.innerHTML = m ? '<span class="nm">' + m.metric + '</span><span class="lo">' + m.rg[0].toFixed(1) + '</span>'
        + '<span class="bar" style="background:' + rampCSS() + '"></span><span class="hi">' + m.rg[1].toFixed(1) + ' ' + m.unit + '</span>' : '';
    }
  }
  function sync(){
    var p = document.getElementById('csPlane'), cap = document.getElementById('csCap'), st = document.getElementById('csSteps'), c = CASES[cur];
    if(c.heat) fillHeat();
    else if(p){
      p.className = 'cs-plane s' + stage;
      Array.prototype.forEach.call(p.querySelectorAll('[data-mk]'), function(el){ el.classList.toggle('on', +el.dataset.mk === stage); });
    }
    if(cap) cap.innerHTML = stage ? (c.st[stage - 1].cap || '') : '';
    if(st){ st.innerHTML = stepsHTML(); st.dataset.play = mode; queueStepProgress(); }
  }
  function stop(){
    if(timer){ clearTimeout(timer); timer = null; }
    freezeStepProgress();
    DemoPointer.stop(); setMode('idle');
  }
  function showCaseStage(next, done){
    /* 案例二第四段不是数据自己突变，而是用户换了度量：先明确演示点击，再换图。 */
    if(CASES[cur].heat && next === 4){
      DemoPointer.click('#csVtabs button[data-v="idle"]', function(){ stage = next; sync(); if(done) done(); }, '切到空闲时间');
    } else { stage = next; sync(); if(done) done(); }
  }
  /* 分段动效：传播案例从空图开始一段一段亮起来；热力案例直接站在「健康运行中」那一幅上
     （第一幅是日常态，不该有从左铺到右的扫描——扫描是留给「问题出现」的），从第二段起才过渡 */
  function play(){
    stop();
    setMode('full');
    var heat = CASES[cur].heat, n = steps().length, duration = heat ? 2100 : 1700;
    function holdStep(s){
      beginStepProgress(s, duration);
      timer = setTimeout(function(){
        timer = null; finishStepProgress();
        if(s < n) showCaseStage(s + 1, function(){ holdStep(s + 1); });
        else setMode('idle');
      }, duration);
    }
    if(heat){ stage = 1; syncInstant(); holdStep(1); }
    else{
      stage = 0; setStepProgress(0, 0); sync();
      timer = setTimeout(function(){ timer = null; showCaseStage(1, function(){ holdStep(1); }); }, 420);
    }
  }
  /* 点段控：只播这一段一次——先瞬间退回上一段的样子，再过渡到这一段，走完后停在最终画面。
     热力案例的第一段是日常态，本来就没有过渡可播，点击后直接定格。 */
  function playStepOnce(s){
    stop(); setMode('single');
    var heat = CASES[cur].heat, duration = heat ? 2100 : 1700;
    if(heat && s === 1){ stage = 1; setStepProgress(1, 1); sync(); setMode('idle'); return; }
    stage = s - 1; syncInstant();
    timer = setTimeout(function(){
      timer = null;
      showCaseStage(s, function(){
        beginStepProgress(s, duration);
        timer = setTimeout(function(){ timer = null; finishStepProgress(); setMode('idle'); }, duration);
      });
    }, 420);
  }
  /* 关掉背景色过渡填一遍，下一帧再把过渡打开 */
  function syncInstant(){
    var p = document.getElementById('csPlane');
    if(p) p.classList.add('nt');
    sync();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ if(p) p.classList.remove('nt'); }); });
  }

  railEl.addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]'); if(!b) return;
    stop(); cur = +b.dataset.i; stage = (CASES[cur].st || []).length; render(); writeQ();
  });
  mainEl.addEventListener('click', function(e){
    /* 播放键：全流程播着就暂停；停着或单段播放中就回到全流程从头播 */
    if(e.target.closest('button[data-rep]')){ if(mode === 'full') stop(); else play(); return; }
    var v = e.target.closest('button[data-v]');
    if(v){
      stop(); stage = v.dataset.v === 'idle' ? 4 : Math.min(Math.max(stage, 1), 3);
      setStepProgress(stage, 1); sync(); return;
    }
    var b = e.target.closest('button[data-s]');
    if(b) playStepOnce(+b.dataset.s);
  });
  function writeQ(){
    try{ var q = new URLSearchParams(location.search);
      if(cur) q.set('case', String(cur + 1)); else q.delete('case');
      var s = q.toString(); history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
    }catch(e){}
  }
  /* 页签切回来 / 窗口变化都要重量一次尺寸；不在这一页时不跑动效 */
  if(tabsEl) tabsEl.addEventListener('click', function(){
    setTimeout(function(){ if(active()){ paint(); play(); } else stop(); }, 0);
  });
  var rz = null;
  window.addEventListener('resize', function(){
    if(!active()) return;
    clearTimeout(rz); rz = setTimeout(paint, 120);
  });
  /* 热力的色阶分主题，切主题后把当前这一段重填一遍（段控条的颜色也随之换） */
  var themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.addEventListener('click', function(){
    setTimeout(function(){
      if(!CASES[cur].heat) return;
      ST2.forEach(function(s, i){ s.c = heatColor([.28, .48, .85, .62][i]); });
      sync();
    }, 0);
  });

  var q0 = new URLSearchParams(location.search), ci = parseInt(q0.get('case'), 10);
  if(isFinite(ci) && ci >= 1 && ci <= CASES.length) cur = ci - 1;
  if(CASES[cur].st) stage = CASES[cur].st.length;
  render();
})();
</script>
</body>
</html>
